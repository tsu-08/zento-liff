<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記録書の確認</title>
<!-- 全棟品質評価 確認画面（LIFF）v2 2026-10-29（v1 から：検査員のフルネーム入力）
     ここには鍵もデータも置かない。データはGASがLINEのIDトークンを確かめてから返す（61 0.1の5）
     画面に施主名・工務店名・個人名は出さない（必須） -->
<style>
  :root { --bg:#f6f7f5; --card:#fff; --ink:#1d2421; --sub:#5d6b65; --line:#dde3df; --acc:#1f7a6d; --warn:#b4541a; --warnbg:#fdf1e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111614; --card:#1a201d; --ink:#e8eeeb; --sub:#9aa8a1; --line:#2c3531; --acc:#4fb8a6; --warn:#f0a36b; --warnbg:#2b2018; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:4px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; gap:8px; }
  .k { color:var(--sub); font-size:13px; }
  .score { font-size:32px; font-weight:700; color:var(--acc); }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; border:1px solid var(--line); color:var(--sub); margin-right:4px; }
  .tag.warn { border-color:var(--warn); color:var(--warn); }
  .issue { border-top:1px solid var(--line); padding:10px 0; }
  .issue:first-child { border-top:none; }
  .issue .t { font-weight:600; }
  .check { background:var(--warnbg); border:1px solid var(--warn); border-radius:10px; padding:12px; margin-bottom:10px; }
  button { font:inherit; border-radius:8px; border:1px solid var(--acc); background:var(--acc); color:#fff; padding:8px 16px; margin:6px 6px 0 0; }
  button.sec { background:transparent; color:var(--acc); }
  .muted { color:var(--sub); font-size:13px; }
  .err { color:var(--warn); }
  s { color:var(--sub); }
</style>
</head>
<body>
<main>
  <h1>記録書の確認</h1>
  <div id="app" class="card">読み込み中…</div>
  <p class="muted">この画面はLINEのボタンから開いた本人だけが見られます。リンクを他の人に送っても開けません。</p>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ===== 設定（鍵ではない。公開されても困らない値だけ） =====
const LIFF_ID = '2012275755-X1vUnCK8';
const API_URL = 'https://script.google.com/macros/s/AKfycbyljjXpJ46GLpiUFloQ3nnCi0ASy2Mhc88gn8C3z_kJo04ncJ8uJ5QWS-blT58K4ebM/exec';
// =====
const app = document.getElementById('app');
const fileId = new URLSearchParams(location.search).get('f')
  || new URLSearchParams((new URLSearchParams(location.search).get('liff.state') || '').replace(/^\?/, '')).get('f');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function call(extra) {
  const q = new URLSearchParams(Object.assign({ t: liff.getIDToken(), f: fileId }, extra || {}));
  const res = await fetch(API_URL + '?' + q.toString());
  return res.json();
}

function render(d) {
  if (!d.ok) { app.innerHTML = '<p class="err">' + esc(d.error) + '</p>'; return; }
  if (d.state !== '完了') {
    app.innerHTML = '<p>' + esc(d.message) + '</p><button onclick="load()">更新</button>';
    return;
  }
  let h = d.answer ? '<p class="err" style="color:var(--acc)">' + esc(d.answer) + '</p>' : '';
  h += '<div class="row"><div><div class="k">物件</div><div>' + esc(d.name) + '</div></div>'
        + '<div><div class="k">工程・検査日</div><div>' + esc(d.process) + '　' + esc(d.date) + '</div></div></div>'
        + '<div class="row" style="margin-top:8px"><div><div class="k">暫定の点数</div><div class="score">' + esc(d.score) + '</div></div>'
        + '<div class="muted" style="align-self:end">確定前の点数です</div></div>';
  if (d.checks && d.checks.length) {
    h += '<h2 style="font-size:16px;margin:16px 0 8px">確認してください</h2>';
    d.checks.forEach(c => {
      h += '<div class="check">' + esc(c.text);
      if (c.type === 'inspector') {
        h += c.done ? '<div class="muted">回答済み</div>'
          : '<div><button onclick="answer(1)">はい</button><button class="sec" onclick="answer(0)">違う</button></div>';
      }
      if (c.type === 'fullname') {
        h += c.done ? '<div class="muted">回答済み</div>'
          : '<div><input id="fullname" placeholder="例：山田 太郎" style="font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;width:60%;background:var(--card);color:var(--ink)"><button onclick="answerName()">送る</button></div>';
      }
      h += '</div>';
    });
  }
  h += '<h2 style="font-size:16px;margin:16px 0 8px">読み取った指摘（' + d.shiteki.length + '件）</h2>';
  d.shiteki.forEach(s => {
    const tags = '<span class="tag' + (s.kind === '特記' ? ' warn' : '') + '">' + esc(s.kind) + '</span>'
      + (s.ask ? '<span class="tag warn">要確認</span>' : '')
      + (s.places > 1 ? '<span class="tag">' + esc(s.places) + 'か所</span>' : '');
    const text = s.cancelled ? '<s>' + esc(s.text) + '</s>' : esc(s.text);
    h += '<div class="issue"><div>' + (s.no ? 'No.' + esc(s.no) + '　' : '') + tags + '</div>'
      + '<div class="t">' + text + '</div>'
      + (s.item ? '<div class="muted">項目：' + esc(s.item) + '</div>' : '')
      + (s.place ? '<div class="muted">場所：' + esc(s.place) + '</div>' : '') + '</div>';
  });
  h += '<p class="muted" style="margin-top:12px">指摘の直し・写真の貼り付け・承認依頼は、次の版で付けます。</p>';
  app.innerHTML = h;
}

async function load() { app.textContent = '読み込み中…'; try { render(await call()); } catch (e) { app.innerHTML = '<p class="err">通信できませんでした。もう一度開いてください。</p>'; } }
async function answerName() {
  const v = (document.getElementById('fullname') || {}).value || '';
  if (!v.trim()) return;
  app.textContent = '送信中…'; try { render(await call({ a: 'fullname', name: v.trim() })); } catch (e) { load(); }
}
async function answer(ok) { app.textContent = '送信中…'; try { render(await call({ a: 'inspector', ok: ok })); } catch (e) { load(); } }

liff.init({ liffId: LIFF_ID }).then(() => {
  if (!liff.isLoggedIn()) { liff.login(); return; }
  if (!fileId) { app.innerHTML = '<p class="err">開き方が違います。LINEのボタンから開いてください。</p>'; return; }
  load();
}).catch(() => { app.innerHTML = '<p class="err">LINEの中で開いてください。</p>'; });
</script>
</body>
</html>
