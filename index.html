<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記録書の確認</title>
<!-- 全棟品質評価 確認画面（LIFF）v13 2026-11-03（v12 から：たたんだ表示でも指摘に置いた写真を小さく出し、そこから押さえて別の指摘・未割当・好例へ動かせるようにする）
     v12（v11 から：写真を指で押さえて動かす（ドラッグ＆ドロップ）。写真を選ぶ・動かす間は指摘を表題だけにたたむ。未割当の選択は1枚ずつ）
     v11（v10 から：LINEのトークで送った写真が未割当にあれば、開いたときにAIの振り分けを自動で始める）
     v10（v9 から：写真をまとめて追加→AIが指摘に仮振り分け、決められないものは未割当。写真を押して選び、指摘・未割当・好例へ移せる。好例は好例欄に直接貼るか未割当から移す。見出し・項目は任意）
     ここには鍵もデータも置かない。データはGASがLINEのIDトークンを確かめてから返す（61 0.1の5）
     画面に施主名・工務店名・個人名は出さない（必須） -->
<style>
  :root { --bg:#f6f7f5; --card:#fff; --ink:#1d2421; --sub:#5d6b65; --line:#dde3df; --acc:#1f7a6d; --warn:#b4541a; --warnbg:#fdf1e8; --new:#e8f4f1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111614; --card:#1a201d; --ink:#e8eeeb; --sub:#9aa8a1; --line:#2c3531; --acc:#4fb8a6; --warn:#f0a36b; --warnbg:#2b2018; --new:#17302b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; padding-bottom:72px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:4px 0 12px; }
  h2 { font-size:16px; margin:16px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; gap:8px; }
  .k { color:var(--sub); font-size:13px; }
  .score { font-size:32px; font-weight:700; color:var(--acc); }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; border:1px solid var(--line); color:var(--sub); margin-right:4px; }
  .tag.warn { border-color:var(--warn); color:var(--warn); }
  .tag.acc { border-color:var(--acc); color:var(--acc); }
  .issue { border-top:1px solid var(--line); padding:10px 0; }
  .issue:first-child { border-top:none; }
  .issue.changed { background:var(--new); margin:0 -8px; padding:10px 8px; border-radius:8px; }
  .issue .t { font-weight:600; }
  .check { background:var(--warnbg); border:1px solid var(--warn); border-radius:10px; padding:12px; margin-bottom:10px; }
  button { font:inherit; border-radius:8px; border:1px solid var(--acc); background:var(--acc); color:#fff; padding:8px 16px; margin:6px 6px 0 0; }
  button.sec { background:transparent; color:var(--acc); }
  button.small { padding:4px 10px; font-size:13px; }
  .muted { color:var(--sub); font-size:13px; }
  .err { color:var(--warn); }
  .ok { color:var(--acc); }
  s { color:var(--sub); }
  .edit { margin-top:8px; padding:10px; border:1px dashed var(--line); border-radius:8px; display:none; }
  .edit.open { display:block; }
  .edit label { display:block; font-size:13px; color:var(--sub); margin-top:6px; }
  .edit select, .edit input[type=text] { font:inherit; width:100%; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px; display:none; }
  .bar.show { display:block; }
  .bar .in { max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .bar button { margin:0 0 0 6px; }
.tag.ok{background:#E3F4EA;color:#1E7A45;border-color:#1E7A45}
.photos{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.ph{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.up{opacity:.55}
.phx{position:absolute;top:0;right:0;margin:0;padding:0 7px;font-size:14px;line-height:22px;border-radius:0 0 0 6px;background:rgba(0,0,0,.55);border:none;color:#fff}
.phs{position:absolute;bottom:0;left:0;right:0;font-size:11px;text-align:center;background:rgba(255,255,255,.85);color:#333}
.phadd{display:inline-block;font-size:13px;color:var(--acc);border:1px dashed var(--acc);border-radius:8px;padding:6px 10px;cursor:pointer}
.ph{cursor:pointer}
.ph.sel{outline:3px solid var(--acc);outline-offset:-3px}
.phai{position:absolute;left:0;top:0;font-size:10px;line-height:16px;background:var(--acc);color:#fff;padding:0 4px;border-radius:0 0 6px 0}
.tray{border:1px dashed var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.goodrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.goodrow img{width:40px;height:40px;object-fit:cover;border-radius:4px;flex:none}
.goodrow input,.goodrow select{flex:1;min-width:0;font:inherit;font-size:13px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.ph{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.85;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.drophover{outline:3px dashed var(--acc);outline-offset:2px;border-radius:8px}
.phcount{display:none;font-size:12px;color:var(--sub)}
body.picking .issue .muted, body.picking .issue .edit, body.picking .issue > button, body.picking .issue .tag, body.picking .issue .photos .phadd { display:none !important; }
body.picking .issue .ph{width:48px;height:48px}
body.picking .issue{padding:8px 0}
body.picking .issue .photos{margin-top:2px}
.pickbar{display:flex;gap:6px;align-items:center;margin-top:6px}
</style>
</head>
<body>
<main>
  <h1>記録書の確認</h1>
  <div id="app" class="card">読み込み中…</div>
  <p class="muted">この画面はLINEのボタンから開いた本人だけが見られます。リンクを他の人に送っても開けません。</p>
</main>
<div class="bar" id="bar"><div class="in"><span id="barText"></span><span><button class="sec small" id="retryBtn" onclick="retryAll()" style="display:none">もう一度送る</button></span></div></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ===== 設定（鍵ではない。公開されても困らない値だけ） =====
const LIFF_ID = '2012275755-X1vUnCK8';
const API_URL = 'https://script.google.com/macros/s/AKfycbyljjXpJ46GLpiUFloQ3nnCi0ASy2Mhc88gn8C3z_kJo04ncJ8uJ5QWS-blT58K4ebM/exec';
// =====
const app = document.getElementById('app');
const qs = new URLSearchParams(location.search);
const fileId = qs.get('f') || new URLSearchParams((qs.get('liff.state') || '').replace(/^\?/, '')).get('f');
const sessionStart = Date.now();   // 手直しの時間の記録用（画面を開いた時刻）
const KINDS = ['指摘', '未施工', '申し送り', '特記'];
const PLACES = [['1', '1か所'], ['2', '2か所'], ['3+', '3か所以上（共通）']];
let last = null;          // 最後に受け取った内容
let savedIds = new Set(); // この画面で保存した指摘
let savedMsg = '';         // 保存直後に下に出す文
let sending = false, failed = false, timer = null, renderLater = false, savedAt = '';
const openSet = new Set();   // 開いている「直す」欄
let upq = [], upBusy = false, upFailed = false, removedPhotos = [];   // 写真の送信待ち
let pend = {};            // 直したが未保存のもの { 指摘ID: {kind,item,places,fix,cancel} }
let adds = [];            // 追記したが未保存のもの
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const placesKey = s => (s.common || Number(s.places) >= 3) ? '3+' : (Number(s.places) === 2 ? '2' : '1');

async function getData(extra) {
  const q = new URLSearchParams(Object.assign({ t: liff.getIDToken(), f: fileId, s: sessionStart }, extra || {}));
  return (await fetch(API_URL + '?' + q.toString())).json();
}
async function postData(body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ liff: true, t: liff.getIDToken(), f: fileId, s: sessionStart }, body)) });
  return res.json();
}

function opts(list, cur) { return list.map(([v, l]) => '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>').join(''); }
function itemOpts(cur) { return '<option value="">（項目なし）</option>' + (last.items || []).map(i => '<option value="' + esc(i.id) + '"' + (i.id === cur ? ' selected' : '') + '>' + esc(i.name) + '</option>').join(''); }
function fixesOf(item) { const i = (last.items || []).find(x => x.id === item); return i ? (i.fixes || []) : []; }
function fixOpts(item, kz) {
  const f = fixesOf(item);
  if (!f.length) return '';
  return '<label>登録の是正指示から選ぶ</label><select onchange="pickFix(this)" data-item="' + esc(item) + '"><option value="">（選ばない）</option>'
    + f.map(x => '<option value="' + esc(x.id) + '"' + (x.id === kz ? ' selected' : '') + '>' + esc(x.title) + '</option>').join('') + '</select>';
}
const FROM = { '記録書': '記録書', '改善策': '登録', 'AI案': 'AI案', '改善策（確認画面）': '登録', '確認画面': '手入力' };
function itemName(id) { const i = (last.items || []).find(x => x.id === id); return i ? i.name : ''; }

function render(d) {
  last = d;
  if (!d.ok) { app.innerHTML = '<p class="err">' + esc(d.error) + '</p>'; updateBar(); return; }
  if (d.state !== '完了') { app.innerHTML = '<p>' + esc(d.message) + '</p><button onclick="load()">更新</button>'; updateBar(); return; }
  let h = d.answer ? '<p class="ok">' + esc(d.answer) + '</p>' : '';
  h += '<div class="row"><div><div class="k">物件</div><div>' + esc(d.name) + '</div></div>'
     + '<div><div class="k">工程・検査日</div><div>' + esc(d.process) + '　' + esc(d.date) + '</div></div></div>'
     + '<div class="row" style="margin-top:8px"><div><div class="k">暫定の点数</div><div class="score">' + esc(d.score) + '</div></div>'
     + '<div class="muted" style="align-self:end">確定前の点数です</div></div>';
  if (d.checks && d.checks.length) {
    h += '<h2>確認してください</h2>';
    d.checks.forEach(c => {
      h += '<div class="check">' + esc(c.text);
      if (c.type === 'inspector') h += c.done ? '<div class="muted">回答済み</div>' : '<div><button onclick="answer(1)">はい</button><button class="sec" onclick="answer(0)">違う</button></div>';
      if (c.type === 'fullname') h += c.done ? '<div class="muted">回答済み</div>' : '<div><input id="fullname" placeholder="例：山田 太郎" style="font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;width:60%;background:var(--card);color:var(--ink)"><button onclick="answerName()">送る</button></div>';
      h += '</div>';
    });
  }
  h += '<h2>読み取った指摘（' + d.shiteki.length + '件）</h2>';
  h += trayHtml();
  d.shiteki.forEach(s => { h += issueHtml(s); });
  adds.forEach((a, i) => { h += addedHtml(a, i); });
  if (d.editable) {
    h += '<div style="margin-top:12px"><button class="sec" onclick="toggle(\'new\')">＋ 指摘を追加（記録書にないもの）</button>' + newForm() + '</div>';
  }
  h += goodHtml();
  h += '<p class="muted" style="margin-top:12px">直したところは数秒後に自動で保存します（送っている間も作業を続けられます）。閉じたときに送りきれていない分も送ります。写真は「まとめて追加」でAIが指摘に振り分けます（違うものは写真を押して付け替え）。指摘ごとの「写真を貼る」でも貼れます。承認依頼は次の版で付けます。</p>';
  app.innerHTML = h;
  openSet.forEach(id => { const e = document.getElementById('ed-' + id); if (e) e.classList.add('open'); });
  document.body.classList.toggle('picking', selPh.size > 0);
  updateBar();
}

function issueHtml(s) {
  const p = pend[s.id] || {};
  const v = { kind: p.kind ?? s.kind, item: p.item ?? s.itemId, places: p.places ?? placesKey(s), fix: p.fix ?? (s.fix || ''), kz: p.kz ?? (s.kz || ''), cancel: p.cancel ?? s.cancelled };
  const changed = !!pend[s.id];
  const plLabel = (PLACES.find(x => x[0] === v.places) || PLACES[0])[1];
  const how = s.method === '追記' ? '<span class="tag acc">追記</span>'
    : (s.method === '予測→修正' ? '<span class="tag acc">修正済</span>' : (s.conf ? '<span class="tag">AI予測・自信' + esc(s.conf) + '</span>' : ''));
  const tags = '<span class="tag' + (v.kind === '特記' ? ' warn' : '') + '">' + esc(v.kind) + '</span>'
    + (s.ask ? '<span class="tag warn">要確認</span>' : '')
    + (v.places !== '1' ? '<span class="tag' + (v.places === '3+' ? ' warn' : '') + '">' + esc(plLabel) + '</span>' : '')
    + (s.severe ? '<span class="tag warn">重大</span>' : '')
    + (v.cancel ? '<span class="tag">取消</span>' : '')
    + (changed ? '<span class="tag acc">保存待ち</span>' : (savedIds.has(s.id) ? '<span class="tag ok">保存済</span>' : ''));
  const text = v.cancel ? '<s>' + esc(s.text) + '</s>' : esc(s.text);
  const k = esc(s.id);
  let h = '<div class="issue' + (changed ? ' changed' : '') + '" data-drop="' + k + '"><div>' + (s.no ? 'No.' + esc(s.no) + '　' : '') + tags + '</div>'
    + '<div class="t">' + text + '</div>'
    + '<div class="muted">項目：' + (esc(itemName(v.item)) || '（なし）') + ' ' + how + '</div>'
    + '<div class="muted">是正：' + (esc(v.fix) || '（なし）') + (changed ? '' : (FROM[s.fixFrom] ? ' <span class="tag">' + FROM[s.fixFrom] + '</span>' : '')) + '</div>'
    + (s.place ? '<div class="muted">場所：' + esc(s.place) + '</div>' : '');
  h += photoHtml(s.id);
  if (last.editable) {
    h += '<button class="sec small" onclick="toggle(\'' + k + '\')">直す</button>'
      + '<div class="edit" id="ed-' + k + '">'
      + '<label>種別</label><select onchange="setp(\'' + k + '\',\'kind\',this.value)">' + opts(KINDS.map(x => [x, x]), v.kind) + '</select>'
      + '<label>項目</label><select onchange="setp(\'' + k + '\',\'item\',this.value)">' + itemOpts(v.item) + '</select>'
      + '<label>か所数</label><select onchange="setp(\'' + k + '\',\'places\',this.value)">' + opts(PLACES, v.places) + '</select>'
      + fixOpts(v.item, v.kz).replace('pickFix(this)', 'pickFix(this,\'' + k + '\')')
      + '<label>是正指示</label><input type="text" value="' + esc(v.fix) + '" onchange="setp(\'' + k + '\',\'fix\',this.value)" oninput="setq(\'' + k + '\',\'fix\',this.value)">'
      + '<label><input type="checkbox"' + (v.cancel ? ' checked' : '') + ' onchange="setp(\'' + k + '\',\'cancel\',this.checked)"> 取消（この指摘は数えない）</label>'
      + '</div>';
  }
  return h + '</div>';
}

function addedHtml(a, i) {
  const plLabel = (PLACES.find(x => x[0] === a.places) || PLACES[0])[1];
  return '<div class="issue changed"><div><span class="tag acc">追記</span><span class="tag">' + esc(a.kind) + '</span><span class="tag">' + esc(plLabel) + '</span><span class="tag acc">保存待ち</span></div>'
    + '<div class="t">' + esc(a.text) + '</div>'
    + '<div class="muted">項目：' + (esc(itemName(a.item)) || '（なし）') + '</div>'
    + '<div class="muted">是正：' + (esc(a.fix) || '（なし）') + '</div>'
    + (a.place ? '<div class="muted">場所：' + esc(a.place) + '</div>' : '')
    + '<button class="sec small" onclick="removeAdd(' + i + ')">追記をやめる</button></div>';
}

function newForm() {
  return '<div class="edit" id="ed-new">'
    + '<label>指摘の内容（必須）</label><input type="text" id="n-text">'
    + '<label>場所</label><input type="text" id="n-place">'
    + '<label>種別</label><select id="n-kind">' + opts(KINDS.map(x => [x, x]), '指摘') + '</select>'
    + '<label>項目</label><select id="n-item" onchange="newItem(this.value)">' + itemOpts('') + '</select>'
    + '<div id="n-fixsel"></div>'
    + '<label>か所数</label><select id="n-places">' + opts(PLACES, '1') + '</select>'
    + '<label>是正指示</label><input type="text" id="n-fix">'
    + '<button onclick="addNew()">一覧に加える</button><span class="muted">（加えると自動で保存します）</span></div>';
}

function pickFix(sel, id) {
  const x = fixesOf(sel.dataset.item).find(f => f.id === sel.value);
  if (id) { pend[id] = Object.assign(pend[id] || {}, { kz: sel.value }); if (x) pend[id].fix = x.how; setp(id, 'kz', sel.value); return; }
  document.getElementById('n-kz').value = sel.value; if (x) document.getElementById('n-fix').value = x.how;
}
function newItem(item) { document.getElementById('n-fixsel').innerHTML = fixOpts(item, '') + '<input type="hidden" id="n-kz" value="">'; }
function toggle(id) { const e = document.getElementById('ed-' + id); if (!e) return; e.classList.toggle('open'); if (e.classList.contains('open')) openSet.add(id); else openSet.delete(id); }
function setp(id, key, val) {
  const s = last.shiteki.find(x => x.id === id); if (!s) return;
  pend[id] = Object.assign(pend[id] || {}, { [key]: val });
  if (key === 'item') pend[id].kz = '';
  // 元と同じに戻したら未保存から外す
  const p = pend[id], same = (p.kind ?? s.kind) === s.kind && (p.item ?? s.itemId) === s.itemId && (p.places ?? placesKey(s)) === placesKey(s)
    && (p.fix ?? (s.fix || '')) === (s.fix || '') && (p.kz ?? (s.kz || '')) === (s.kz || '') && (p.cancel ?? s.cancelled) === s.cancelled;
  if (same) delete pend[id];
  rerender();
  schedule();
}
// 入力中の文字：画面は書き換えず、入力が止まってから送る
function setq(id, key, val) {
  const s = last.shiteki.find(x => x.id === id); if (!s) return;
  pend[id] = Object.assign(pend[id] || {}, { [key]: val });
  schedule(2500);
}
function rerender() { const y = window.scrollY; render(last); window.scrollTo(0, y); }
function addNew() {
  const g = n => document.getElementById('n-' + n).value;
  if (!g('text').trim()) { const p = document.createElement('p'); p.className = 'err'; p.textContent = '指摘の内容を入れてください。'; document.getElementById('ed-new').prepend(p); return; }
  const kzEl = document.getElementById('n-kz');
  adds.push({ text: g('text').trim(), place: g('place').trim(), kind: g('kind'), item: g('item'), places: g('places'), fix: g('fix').trim(), kz: kzEl ? kzEl.value : '' });
  openSet.delete('new');
  rerender();
  schedule(300);
}
function removeAdd(i) { adds.splice(i, 1); rerender(); }
function discard() { pend = {}; adds = []; rerender(); }
function updateBar() {
  const n = Object.keys(pend).length + adds.length;
  const text = upFailed ? '写真を送れませんでした（残り' + upq.length + '枚）。電波のよい所で「もう一度送る」を押してください。'
    : failed ? '保存できませんでした（' + n + '件）。電波のよい所で「もう一度送る」を押してください。'
    : assigning ? 'AIが写真を指摘に振り分け中…（作業は続けられます）'
    : upq.length ? '写真を送信中 残り' + upq.length + '枚…（作業は続けられます。送り終わるまで閉じないでください）'
    : sending ? '保存中…（このまま作業を続けられます）'
    : n ? '保存待ち ' + n + '件（数秒後に自動で保存）'
    : photoMsg ? photoMsg
    : savedAt ? '✓ 保存しました（' + savedAt + '）' : '';
  document.getElementById('bar').classList.toggle('show', !!text);
  document.getElementById('barText').textContent = text;
  document.getElementById('retryBtn').style.display = (failed || upFailed) ? '' : 'none';
}
function snapshot() {
  const edits = Object.keys(pend).map(id => {
    const s = last.shiteki.find(x => x.id === id), p = pend[id];
    return { id: id, kind: p.kind ?? s.kind, item: p.item ?? s.itemId, places: p.places ?? placesKey(s), fix: p.fix ?? (s.fix || ''), kz: p.kz ?? (s.kz || ''), cancel: p.cancel ?? s.cancelled };
  });
  return { edits: edits, adds: adds.slice() };
}
function schedule(ms) { clearTimeout(timer); timer = setTimeout(flush, ms ?? 1500); updateBar(); }
// 裏で送る。送っている間に直したものは、次の回に送る
async function flush() {
  clearTimeout(timer);
  if (sending) { timer = setTimeout(flush, 800); return; }
  if (!(Object.keys(pend).length + adds.length)) { updateBar(); return; }
  const snap = snapshot(), sentP = JSON.parse(JSON.stringify(pend));
  sending = true; failed = false; updateBar();
  try {
    const d = await postData({ a: 'save', edits: snap.edits, adds: snap.adds });
    if (!d.ok) throw new Error(d.error || '');
    snap.edits.forEach(e => { savedIds.add(e.id); if (JSON.stringify(pend[e.id]) === JSON.stringify(sentP[e.id])) delete pend[e.id]; });
    adds = adds.filter(a => !snap.adds.includes(a));
    (d.shiteki || []).filter(x => x.method === '追記').forEach(x => savedIds.add(x.id));
    savedAt = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    d.answer = '';
    sending = false;
    applyData(d);
  } catch (e) { sending = false; failed = true; }
  updateBar();
  if (!failed && Object.keys(pend).length + adds.length) schedule();
}
const saveAll = flush;
// 文字を入力している最中は画面を書き換えない（入力が終わってから反映）
function typing() { const a = document.activeElement; return a && app.contains(a) && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'); }
function applyData(d) {
  // 送ったばかりの写真が返事に入っていなくても消さない
  const ids = new Set((d.photos || []).map(x => x.id)), gone = new Set(removedPhotos);
  d.photos = (d.photos || []).filter(x => !gone.has(x.id)).concat(((last && last.photos) || []).filter(x => !ids.has(x.id) && !gone.has(x.id)));
  if (typing()) { last = d; renderLater = true; return; } const y = window.scrollY; render(d); window.scrollTo(0, y); }
document.addEventListener('focusout', () => { if (renderLater) setTimeout(() => { if (!typing() && renderLater) { renderLater = false; rerender(); } }, 0); });
// 閉じる・アプリを切り替えるときに、送りきれていない分を送る
function flushOnClose() {
  if (!last || !(Object.keys(pend).length + adds.length)) return;
  const snap = snapshot();
  try {
    fetch(API_URL, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ liff: true, t: liff.getIDToken(), f: fileId, s: sessionStart, a: 'save', edits: snap.edits, adds: snap.adds }) });
    pend = {}; adds = [];
  } catch (e) { }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushOnClose(); });
window.addEventListener('pagehide', flushOnClose);

// ===== 写真 =====
// 貼る先：指摘ID／''（未割当。まとめて追加した写真はAIが指摘に振り分ける）／'__good'（好例。AIは振り分けない）
let selPh = new Set(), assigning = false, photoMsg = '', newUnassigned = 0;
function img64(b) { return b ? '<img alt="" src="data:image/jpeg;base64,' + b + '">' : ''; }
function tile(x) {
  const i = esc(x.id);
  return '<span class="ph' + (selPh.has(x.id) ? ' sel' : '') + '" onpointerdown="phDown(event,\'' + i + '\')" onpointermove="phMove(event)" onpointerup="phUp(event)" onpointercancel="phCancel()" oncontextmenu="return false">' + img64(x.thumb)
    + (x.how === 'AI仮振り分け' ? '<span class="phai">AI</span>' : '')
    + (last.editable ? '<button class="phx" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();delPhoto(\'' + esc(x.id) + '\')">×</button>' : '') + '</span>';
}
function upTile(x) { return '<span class="ph up">' + img64(x.thumb) + '<span class="phs">送信待ち</span></span>'; }
function addBtn(to, label) { return last.editable ? '<label class="phadd">' + label + '<input type="file" accept="image/*" multiple style="display:none" onchange="addPhotos(\'' + to + '\', this)"></label>' : ''; }
function moveBtn(to, label) { return (last.editable && selPh.size) ? '<button class="small" onclick="movePhotos(\'' + to + '\')">' + label + '（' + selPh.size + '枚）</button>' : ''; }
function photosWhere(f) { return (last.photos || []).filter(f); }
function photoHtml(sid) {   // 指摘の下
  const list = photosWhere(x => !x.good && x.sid === sid), up = upq.filter(x => x.sid === sid);
  if (!list.length && !up.length && !last.editable) return '';
  return '<div class="photos">' + '<span class="phcount">写真 ' + (list.length + up.length) + '枚</span>' + list.map(tile).join('') + up.map(upTile).join('') + addBtn(esc(sid), '📷 写真を貼る') + moveBtn(esc(sid), '選んだ写真をここへ') + '</div>';
}
function trayHtml() {       // まとめて追加・未割当
  const list = photosWhere(x => !x.good && !x.sid), up = upq.filter(x => x.sid === '');
  if (!list.length && !up.length && !last.editable) return '';
  return '<div class="tray" data-drop=""><div class="muted">写真をまとめて追加すると、AIが指摘に振り分けます（「AI」の印）。決められなかった写真はここ（未割当）に残ります。'
    + '写真を指で押さえたまま指摘まで動かすと移せます（押して選び「選んだ写真をここへ」でも移せます）。</div><div class="photos">' + list.map(tile).join('') + up.map(upTile).join('')
    + addBtn('', '📷 写真をまとめて追加') + moveBtn('', '未割当に戻す') + '</div>'
    + (selPh.size ? '<div class="pickbar"><span class="muted">' + selPh.size + '枚を選択中</span><button class="sec small" onclick="clearPick()">選択をやめる</button></div>' : '') + '</div>';
}
function goodHtml() {       // 好例（任意。報告書には載せない）
  const list = photosWhere(x => x.good), up = upq.filter(x => x.sid === '__good');
  if (!list.length && !up.length && !last.editable) return '';
  let h = '<div data-drop="__good"><h2>好例写真（任意・報告書には載せません）</h2><div class="photos">' + list.map(tile).join('') + up.map(upTile).join('')
    + addBtn('__good', '📷 好例を貼る') + moveBtn('__good', '選んだ写真を好例へ') + '</div>';
  list.forEach(x => {
    const dis = last.editable ? '' : ' disabled';
    h += '<div class="goodrow">' + img64(x.thumb) + '<input type="text" placeholder="見出し（任意）" value="' + esc(x.title) + '" onchange="setGood(\'' + esc(x.id) + '\',this.value,null)"' + dis + '>'
      + '<select onchange="setGood(\'' + esc(x.id) + '\',null,this.value)"' + dis + '>' + itemOpts(x.item) + '</select></div>';
  });
  return h + '</div>';
}
// 長辺 max px の JPEG にして base64 で返す（保存容量と通信を抑える）
async function shrink(file, max, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = url; });
    const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}
async function addPhotos(to, input) {
  const files = [...input.files]; input.value = '';
  for (const f of files) { const thumb = await shrink(f, 200, 0.6).catch(() => ''); upq.push({ sid: to, file: f, thumb: thumb, taken: f.lastModified || '' }); }
  refreshSoon(); pumpUploads();
}
async function pumpUploads() {
  if (upBusy) return;
  upBusy = true; upFailed = false; updateBar();
  while (upq.length) {
    const x = upq[0];
    try {
      const data = await shrink(x.file, 1600, 0.8);
      const ai = x.sid === '' ? await shrink(x.file, 640, 0.6) : '';
      const d = await postData({ a: 'photo', sid: x.sid, data: data, ai: ai, thumb: x.thumb, taken: x.taken });
      if (!d.ok) throw new Error(d.error || '');
      (last.photos = last.photos || []).push(d.photo);
      if (x.sid === '') newUnassigned++;
      upq.shift();
    } catch (e) { upFailed = true; break; }
    updateBar(); refreshSoon();
  }
  upBusy = false; updateBar(); refreshSoon();
  if (!upFailed && !upq.length && newUnassigned) runAssign();
}
function mergePhotos(list) {
  const ids = new Set((list || []).map(x => x.id)), gone = new Set(removedPhotos);
  return (list || []).filter(x => !gone.has(x.id)).concat(((last && last.photos) || []).filter(x => !ids.has(x.id) && !gone.has(x.id)));
}
function flashPhoto(msg) { photoMsg = msg; updateBar(); setTimeout(() => { photoMsg = ''; updateBar(); }, 10000); }
async function runAssign() {
  assigning = true; updateBar();
  try {
    const d = await postData({ a: 'photoAssign' });
    if (!d.ok) throw new Error(d.error || '');
    newUnassigned = 0;
    last.photos = mergePhotos(d.photos);
    const left = photosWhere(x => !x.good && !x.sid).length;
    flashPhoto('AIが ' + d.assigned + '枚を指摘に振り分けました' + (left ? '（未割当 ' + left + '枚）' : '') + '。違うものは写真を押して付け替えてください');
  } catch (e) { flashPhoto('AIの振り分けができませんでした。未割当の写真を押して、手で振り分けてください'); }
  assigning = false; updateBar(); refreshSoon();
}
function pickPh(id) { if (!last.editable) return; if (selPh.has(id)) selPh.delete(id); else selPh.add(id); refreshSoon(); }
async function movePhotos(to) {
  const pids = [...selPh]; if (!pids.length) return;
  const good = to === '__good';
  photosWhere(x => pids.includes(x.id)).forEach(x => { x.good = good; x.sid = good ? '' : to; x.how = good ? '未割当から好例へ' : (to ? '確認画面で振り分け' : '未割当'); });
  selPh.clear(); refreshSoon();
  try { const d = await postData({ a: 'photoMove', pids: pids, to: to }); if (!d.ok) throw new Error(d.error || ''); last.photos = mergePhotos(d.photos); refreshSoon(); }
  catch (e) { flashPhoto('写真を移せませんでした。開き直してもう一度お試しください'); }
}
async function setGood(pid, title, item) {
  const x = photosWhere(p => p.id === pid)[0]; if (!x) return;
  if (title !== null) x.title = title; if (item !== null) x.item = item;
  try { const d = await postData({ a: 'photoGood', pid: pid, title: x.title, item: x.item }); if (!d.ok) throw new Error(d.error || ''); }
  catch (e) { flashPhoto('好例の見出しを保存できませんでした。もう一度お試しください'); }
}
function refreshSoon() { if (typing() || drag) { renderLater = true; return; } rerender(); }
function clearPick() { selPh.clear(); refreshSoon(); }
// ===== 指で押さえて動かす（ドラッグ＆ドロップ）。動かさずに離したら選ぶ／選ばないの切り替え =====
let drag = null, scrollTimer = null;
function phDown(e, id) {
  if (!last.editable || e.button > 0) return;
  drag = { id: id, x: e.clientX, y: e.clientY, cx: e.clientX, cy: e.clientY, moved: false, ghost: null, src: e.currentTarget };
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (er) { }
}
function phMove(e) {
  if (!drag) return;
  drag.cx = e.clientX; drag.cy = e.clientY;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.moved = true;
    if (!selPh.has(drag.id)) selPh.add(drag.id);
    document.body.classList.add('picking');
    const g = drag.src.cloneNode(true); g.classList.add('ghost'); g.style.width = '64px'; g.style.height = '64px';
    document.body.appendChild(g); drag.ghost = g;
    scrollTimer = setInterval(autoScroll, 30);
  }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - 32) + 'px'; drag.ghost.style.top = (e.clientY - 32) + 'px';
  markHover();
}
function autoScroll() {
  if (!drag) return;
  if (drag.cy < 70) window.scrollBy(0, -14); else if (drag.cy > window.innerHeight - 70) window.scrollBy(0, 14); else return;
  markHover();
}
function dropAt(x, y) { const el = document.elementFromPoint(x, y); return el ? el.closest('[data-drop]') : null; }
function markHover() {
  document.querySelectorAll('.drophover').forEach(el => el.classList.remove('drophover'));
  const z = drag && dropAt(drag.cx, drag.cy); if (z) z.classList.add('drophover');
}
function endDrag() {
  clearInterval(scrollTimer); scrollTimer = null;
  document.querySelectorAll('.drophover').forEach(el => el.classList.remove('drophover'));
  if (drag && drag.ghost) drag.ghost.remove();
}
function phUp(e) {
  if (!drag) return;
  const d = drag;
  if (!d.moved) { drag = null; pickPh(d.id); return; }
  const z = dropAt(e.clientX, e.clientY);
  endDrag(); drag = null; renderLater = false;
  if (z) movePhotos(z.dataset.drop); else rerender();
}
function phCancel() { if (!drag) return; endDrag(); drag = null; rerender(); }
async function delPhoto(pid) {
  if (!confirm('この写真を外しますか？（消さずに別のフォルダへ移します）')) return;
  try {
    const d = await postData({ a: 'photoDel', pid: pid });
    if (!d.ok) throw new Error(d.error || '');
    removedPhotos.push(pid); selPh.delete(pid);
    last.photos = (last.photos || []).filter(x => x.id !== pid);
    refreshSoon();
  } catch (e) { alert('外せませんでした。もう一度お試しください。'); }
}
// LINEのトークで送った写真（まだAIが見ていない未割当）があれば、開いたときに振り分ける
function autoAssign() { if (last && last.editable && photosWhere(x => !x.good && !x.sid && !x.judged).length) { newUnassigned = 1; runAssign(); } }
function retryAll() { if (upq.length) pumpUploads(); else if (newUnassigned) runAssign(); if (failed) flush(); }

async function load() { app.textContent = '読み込み中…'; try { render(await getData()); autoAssign(); } catch (e) { app.innerHTML = '<p class="err">通信できませんでした。もう一度開いてください。</p>'; } }
async function answer(ok) { app.textContent = '送信中…'; try { render(await getData({ a: 'inspector', ok: ok })); } catch (e) { load(); } }
async function answerName() {
  const v = (document.getElementById('fullname') || {}).value || '';
  if (!v.trim()) return;
  app.textContent = '送信中…'; try { render(await getData({ a: 'fullname', name: v.trim() })); } catch (e) { load(); }
}

liff.init({ liffId: LIFF_ID }).then(() => {
  if (!liff.isLoggedIn()) { liff.login(); return; }
  if (!fileId) { app.innerHTML = '<p class="err">開き方が違います。LINEのボタンから開いてください。</p>'; return; }
  load();
}).catch(() => { app.innerHTML = '<p class="err">LINEの中で開いてください。</p>'; });
</script>
