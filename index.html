<!-- 全棟品質評価 確認画面（LIFF）v35 2026-11-22（v34 から：ToDo。①AIの提案に、文のほか項目・か所数・是正指示の案も出す。「採用」1回で全部に効く ②文字起こしを「別の検査へ移す」：近い確定前の検査3件と「探す」（物件名）。確定済みの検査は薄く出し、選ぶと確認のうえ差し戻してから移す）
     v34 2026-11-22（v33 から：11/22 鶴岡。写真を押すと大きく表示（まず小さい写真、続けて元の写真に差し替え）。そこから「選ぶ（動かす・外す）」。押さえて動かすのは今までどおり。選ぶ画面の写真も押すと大きく見られる。文字起こしの一覧に、受けた時刻を太字で、記録書を受けた時刻との差（○分後）を出す）
     v33 2026-11-22（v32 から：11/22 鶴岡。ボタンを押して返事を待つ間は、画面の真ん中に「処理中…（○秒）」と回る印を出し、ほかを押せないようにする（固まったのか処理中なのか分かるように）。30秒を過ぎたら「時間がかかっています」と出す）
     v32 2026-11-18（v31 から：11/18 鶴岡。開くと最初に「選ぶ画面」：行き先が決まっていない写真（送ったまとまりごと）・文字起こし（押すと全文）・音声に入れる先（推測を選んだ状態）を選んで「入れる」、下に確定前の検査のカード（届いた資料の数・指摘の頭・写真・文字起こしの題）。押した検査を開く。確定前が1件だけで行き先待ちもなければ出さない。LINEで押した検査はいちばん上に目立たせる。検査の中の「ほかの確定前の検査を開く」は「検査の一覧へ」に）
     v31 2026-11-17（v30 から：文字起こしの一覧に、受けた日時・題・本文の頭。押すと全文が開く（何の文字起こしか分かるように。11/17 鶴岡））
     v30 2026-11-17（v29 から：11/13 鶴岡。いちばん上に「文字起こし」の欄（件数・見る・＋入れ直す）。開くと一覧と「⇄ 別の検査へ移す」（丸ごと）。新しい文字起こしがあるときだけ「読み直す」。読み直すと、指摘の下に「AIの提案」と 採用／修正／元のまま）
     v29 2026-11-10（v28 から：LINEのリンクの見出しに画面の文字（読み込み中…など）が出ないよう、説明を「全棟品質評価の確認画面」にする）
     v28 2026-11-10（v27 から：確定済みで報告書がまだのとき、ANDPAD報告書を待っていれば「ANDPAD報告書が入ったら作ります」と出す（89 v4））
     v27 2026-11-10（v26 から：89 鶴岡決定。「＋ 好例（その他）」の上に「＋ 全景（表紙）」（1枚。選び直すと前の写真は外す。未割当の写真を押さえて動かしても入る）。同行の検査員がいるときだけ、上に「件数に数える」のチェック（名前は出さない））
     v26 2026-11-10（v25 から：「直す」に報告書に出す指摘の文の欄（記録書の原文は残す）。確定済みの画面に報告書の状態とリンク、「別の形で作る」（87 ④⑥））
     v25 2026-11-09（v24 から：確定を押したあと、入力欄が開いていても必ず確定済みの画面に切り替える。押している間のボタンは「登録しています…」、確定後は「登録済み（確定）」と出す。返事が途中で切れても読み直して今の状態を出す（11/9 鶴岡））
     v24 2026-11-07（v23 から：ゴミ箱の文字を「🗑 別のフォルダへ移動」だけにする（11/7 鶴岡））
     v23 2026-11-07（v22 から：申し送りの欄は1件ずつ「内容・写真・直す」にする。項目と是正は出さず、直す欄も種別と取消だけ（11/7 鶴岡））
     v22 2026-11-07（v21 から：申し送りは指摘と分けて「申し送り（○件）」に内容だけを並べる。項目・是正・写真・直すは出さない（11/7 鶴岡））
     v21 2026-11-07（v20 から：新しい版へ読み直すときに毎回違うURLにして、スマホに残った古い画面を使わないようにする）
     v20 2026-11-07（v19 から：指摘に置いた写真をつかんだとき、写真が小さくならず、たたんだあとも指の下に来るようにする。下は「＋ 指摘を追加」「＋ 好例（その他）を追加」「文字起こしデータあり（なければ＋ 文字起こしを追加）」の3行だけ（11/7 鶴岡）
     v19 2026-11-07（v18 から：写真の右上の×をなくし、写真をつかんだら画面の下にゴミ箱が出て、そこへ落とすと外す（消さずに退避）。つかみやすくする（押さえる時間を0.25秒に、つかんでいる間は画面がスクロールしないように）。選んだ写真は「外す」でも外せる（11/7 鶴岡）
     v18 2026-11-07（v17 から：下の「この画面は開いた本人だけが見られます」を外す（11/7 鶴岡）、確定済みの検査では未割当の欄に「確定済みのため動かせません」と出す）
     v17 2026-11-05（v16 から：画面を簡潔に（11/5 鶴岡「簡潔に、分かりやすく手戻りなく、直感的に」）。上に物件・工程・点数を1枚にまとめ、ほかの確定前の検査へ切り替え。済ませることは「やること」1つにまとめ、済んだら消える。指摘は内容・項目・是正の3行、印は要確認・重大・取消・種別だけ。AI案の「このままでよい」は確定時にまとめて。説明は「？」を押したときだけ。行き先待ちは一覧で選んで入れる。同じ記録書の「上書き／やめる」も画面で選べる（パソコンのLINE向け））
     v16 2026-11-05（v15 から：Android（Pixel など）で写真を押さえて動かせなかった不具合の修正（写真そのものを掴む既定の動きを止め、0.35秒押さえると持ち上がる）、是正指示の選択肢に「自分で入力する」を追加し、選んだときだけ入力欄を出す）
     v15 2026-11-03（v14 から：一番下に「確定する」。押すと先に点検し、止める理由（物件・同じ記録書・検査員の質問）と注意（AI案・要確認・未割当・行き先待ち）を出す。確定したら「09_試行」に書き出し、確定済みの表示にする）
     v14 2026-11-03（v13 から：物件の確認・変更（ANDPAD案件名で検索）、同じ物件・同じ工程の記録書の扱い（上書き／複数登録／やめる）、トークで送った行き先待ちの取り込み、写真を別の検査へ移す、音声・文字起こしの一覧、AI案の「このままでよい」、操作していた時間の計測、古い版なら自動で読み直す）
     v13（v12 から：たたんだ表示でも指摘に置いた写真を小さく出し、そこから押さえて別の指摘・未割当・好例へ動かせるようにする）
     v12（v11 から：写真を指で押さえて動かす（ドラッグ＆ドロップ）。写真を選ぶ・動かす間は指摘を表題だけにたたむ。未割当の選択は1枚ずつ）
     v11（v10 から：LINEのトークで送った写真が未割当にあれば、開いたときにAIの振り分けを自動で始める）
     v10（v9 から：写真をまとめて追加→AIが指摘に仮振り分け、決められないものは未割当。写真を押して選び、指摘・未割当・好例へ移せる。好例は好例欄に直接貼るか未割当から移す。見出し・項目は任意）
     ここには鍵もデータも置かない。データはGASがLINEのIDトークンを確かめてから返す（61 0.1の5）
     物件名は ANDPAD 案件名をそのまま出す（11/3 鶴岡。他社が見る見本・告知では匿名）。住所は扱わない -->
<style>
  :root { --bg:#f6f7f5; --card:#fff; --ink:#1d2421; --sub:#5d6b65; --line:#dde3df; --acc:#1f7a6d; --warn:#b4541a; --warnbg:#fdf1e8; --new:#e8f4f1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111614; --card:#1a201d; --ink:#e8eeeb; --sub:#9aa8a1; --line:#2c3531; --acc:#4fb8a6; --warn:#f0a36b; --warnbg:#2b2018; --new:#17302b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; padding-bottom:72px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:4px 0 12px; }
  h2 { font-size:16px; margin:16px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; gap:8px; }
  .k { color:var(--sub); font-size:13px; }
  .score { font-size:32px; font-weight:700; color:var(--acc); }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; border:1px solid var(--line); color:var(--sub); margin-right:4px; }
  .tag.warn { border-color:var(--warn); color:var(--warn); }
  .tag.acc { border-color:var(--acc); color:var(--acc); }
  .issue { border-top:1px solid var(--line); padding:10px 0; }
  .issue:first-child { border-top:none; }
  .issue.changed { background:var(--new); margin:0 -8px; padding:10px 8px; border-radius:8px; }
  .issue .t { font-weight:600; }
  .check { background:var(--warnbg); border:1px solid var(--warn); border-radius:10px; padding:12px; margin-bottom:10px; }
  button { font:inherit; border-radius:8px; border:1px solid var(--acc); background:var(--acc); color:#fff; padding:8px 16px; margin:6px 6px 0 0; }
  button.sec { background:transparent; color:var(--acc); }
  button.small { padding:4px 10px; font-size:13px; }
  .muted { color:var(--sub); font-size:13px; }
  .err { color:var(--warn); }
  .ok { color:var(--acc); }
  s { color:var(--sub); }
  .edit { margin-top:8px; padding:10px; border:1px dashed var(--line); border-radius:8px; display:none; }
  .edit.open { display:block; }
  .edit label { display:block; font-size:13px; color:var(--sub); margin-top:6px; }
  .edit select, .edit input[type=text] { font:inherit; width:100%; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px; display:none; }
  .bar.show { display:block; }
  .bar .in { max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .bar button { margin:0 0 0 6px; }
.tag.ok{background:#E3F4EA;color:#1E7A45;border-color:#1E7A45}
.photos{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.ph{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.up{opacity:.55}
.trash{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;align-items:center;justify-content:center;height:84px;background:#7a2a1a;color:#fff;font-size:15px;opacity:.92}
body.lifting .trash{display:flex}
.trash.drophover{outline:none;background:#c0391b;opacity:1}
.phx{position:absolute;top:0;right:0;margin:0;padding:0 7px;font-size:14px;line-height:22px;border-radius:0 0 0 6px;background:rgba(0,0,0,.55);border:none;color:#fff}
.phs{position:absolute;bottom:0;left:0;right:0;font-size:11px;text-align:center;background:rgba(255,255,255,.85);color:#333}
.phadd{display:inline-block;font-size:13px;color:var(--acc);border:1px dashed var(--acc);border-radius:8px;padding:6px 10px;cursor:pointer}
.ph{cursor:pointer}
.ph.sel{outline:3px solid var(--acc);outline-offset:-3px}
.phai{position:absolute;left:0;top:0;font-size:10px;line-height:16px;background:var(--acc);color:#fff;padding:0 4px;border-radius:0 0 6px 0}
.tray{border:1px dashed var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.goodrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.goodrow img{width:40px;height:40px;object-fit:cover;border-radius:4px;flex:none}
.goodrow input,.goodrow select{flex:1;min-width:0;font:inherit;font-size:13px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.ph{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ph img{pointer-events:none;-webkit-user-drag:none;user-drag:none}
.ph.lift{transform:scale(1.08);box-shadow:0 0 0 2px var(--acc)}
.fixin{display:none}.fixin.open{display:block}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.85;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.drophover{outline:3px dashed var(--acc);outline-offset:2px;border-radius:8px}
.phcount{display:none;font-size:12px;color:var(--sub)}
body.picking .issue .muted, body.picking .issue .edit, body.picking .issue > button, body.picking .issue .tag, body.picking .issue .photos .phadd { display:none !important; }
body.picking .issue{padding:8px 0}
body.picking .issue .photos{margin-top:2px}
.pickbar{display:flex;gap:6px;align-items:center;margin-top:6px}
.topbox{border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
.topbox.warnbox{background:var(--warnbg);border-color:var(--warn)}
.propres button{display:block;width:100%;text-align:left;margin:4px 0 0}
.files li{margin:4px 0}
.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.head .nm{font-weight:700;font-size:17px;line-height:1.4}
.head .sc{font-size:28px;font-weight:700;color:var(--acc);line-height:1}
.head .scl{font-size:11px;color:var(--sub);text-align:right}
.sw{font:inherit;font-size:13px;width:100%;margin-top:8px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.todo{background:var(--warnbg);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;margin-top:10px}
.todo h3{margin:0 0 4px;font-size:15px;color:var(--warn)}
.todo .ti{border-top:1px dashed var(--warn);padding:8px 0 4px}
.todo .ti:first-of-type{border-top:none}
.help{display:none;font-size:13px;color:var(--sub);background:var(--bg);border-radius:8px;padding:8px;margin-top:6px}
.help.open{display:block}
.q{display:inline-block;width:22px;height:22px;line-height:20px;text-align:center;border:1px solid var(--sub);border-radius:50%;color:var(--sub);font-size:13px;margin:0 0 0 6px;padding:0;background:transparent}
.sec2{display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px}
.sec2 h2{margin:0}
.wl .ph{width:56px;height:56px}
.wl .at{position:absolute;bottom:0;left:0;right:0;font-size:10px;text-align:center;background:rgba(0,0,0,.5);color:#fff}
.fold{cursor:pointer}
.tx{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--card)}
.tx .hd{display:flex;align-items:center;gap:6px;padding:2px 6px 2px 10px;min-height:48px}
.tx .op{flex:1;display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink);padding:10px 0;margin:0;text-align:left}
.tx .cnt{background:var(--new);color:var(--acc);border-radius:999px;padding:0 10px;font-size:13px;font-weight:700}
.tx .li{padding:8px 10px;border-top:1px solid var(--line);font-size:14px;white-space:pre-line}
.tx .rr{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--warnbg);border-top:1px solid var(--line);font-size:14px}
.tx .rr button{margin:0}
.tx .li .row2{display:flex;align-items:flex-start;gap:6px}
.tx .op2{flex:1;display:block;background:none;border:0;color:var(--ink);text-align:left;padding:0;margin:0;font-size:14px}
.tx .tprev{color:var(--sub);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.tx .tbody{font-size:13px;white-space:pre-line;max-height:50vh;overflow:auto;margin-top:4px;color:var(--ink)}
.tx .li .row2 button.sec{margin:0}
.prop{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--new)}

.issue .l2{color:var(--sub);font-size:13px}

.files{margin:4px 0 0;padding-left:18px}
.memo{margin:0 0 14px;padding-left:20px}.memo li{margin:4px 0}
.txtin{width:100%;min-height:90px;font:inherit;font-size:14px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}

.pv .pb button{margin:0}
.pv .pm{color:#ddd;font-size:12px;margin-top:6px;min-height:16px}
.addph{display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;border:1px dashed var(--acc);border-radius:6px;color:var(--acc);font-size:18px;cursor:pointer}
</style>
</head>
<body>
<main>
  <div id="app" class="card">読み込み中…</div>
</main>
<div class="pv" id="pv" onclick="if(event.target===this)closePv()"><img id="pvImg" alt=""><div class="pm" id="pvMsg"></div><div class="pb"><button id="pvPick" onclick="pvPick()">選ぶ（動かす・外す）</button><button class="sec" style="color:#fff;border-color:#fff" onclick="closePv()">閉じる</button></div></div>
<div class="busy" id="busy"><div class="bx"><div class="sp"></div><b id="busyText">処理中…</b><div class="muted" id="busySec"></div><div class="sl" id="busySlow"></div></div></div>
<div class="trash" id="trash" data-drop="__trash">🗑 別のフォルダへ移動</div>
<div class="bar" id="bar"><div class="in"><span id="barText"></span><span><button class="sec small" id="retryBtn" onclick="retryAll()" style="display:none">もう一度送る</button></span></div></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ===== 設定（鍵ではない。公開されても困らない値だけ） =====
const LIFF_ID = '2012275755-X1vUnCK8';
const API_URL = 'https://script.google.com/macros/s/AKfycbyljjXpJ46GLpiUFloQ3nnCi0ASy2Mhc88gn8C3z_kJo04ncJ8uJ5QWS-blT58K4ebM/exec';
// =====
const app = document.getElementById('app');
const qs = new URLSearchParams(location.search);
const fileId = qs.get('f') || new URLSearchParams((qs.get('liff.state') || '').replace(/^\?/, '')).get('f');
const sessionStart = Date.now();   // 手直しの時間の記録用（画面を開いた時刻）
const APP_VER = 35;                 // この画面の版。サーバーの方が新しければ自動で読み直す
// 操作していた時間（3分以上の空白は数えない。11/3 鶴岡 Q13）
let actMs = 0, lastAct = Date.now();
['pointerdown', 'keydown', 'input', 'change'].forEach(ev => document.addEventListener(ev, () => { const n = Date.now(); if (n - lastAct < 180000) actMs += n - lastAct; lastAct = n; }, true));
const KINDS = ['指摘', '未施工', '申し送り', '特記'];
const PLACES = [['1', '1か所'], ['2', '2か所'], ['3+', '3か所以上（共通）']];
let last = null;          // 最後に受け取った内容
let savedIds = new Set(); // この画面で保存した指摘
let savedMsg = '';         // 保存直後に下に出す文
let sending = false, failed = false, timer = null, renderLater = false, savedAt = '';
const openSet = new Set();   // 開いている「直す」欄
let upq = [], upBusy = false, upFailed = false, removedPhotos = [];   // 写真の送信待ち
let pend = {};            // 直したが未保存のもの { 指摘ID: {kind,item,places,fix,cancel} }
let adds = [];            // 追記したが未保存のもの
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const placesKey = s => (s.common || Number(s.places) >= 3) ? '3+' : (Number(s.places) === 2 ? '2' : '1');

async function getData(extra) {
  const q = new URLSearchParams(Object.assign({ t: liff.getIDToken(), f: fileId, s: sessionStart, act: actMs }, extra || {}));
  return (await fetch(API_URL + '?' + q.toString())).json();
}
async function postData(body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ liff: true, t: liff.getIDToken(), f: fileId, s: sessionStart, act: actMs }, body)) });
  return res.json();
}

function opts(list, cur) { return list.map(([v, l]) => '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>').join(''); }
function itemOpts(cur) { return '<option value="">（項目なし）</option>' + (last.items || []).map(i => '<option value="' + esc(i.id) + '"' + (i.id === cur ? ' selected' : '') + '>' + esc(i.name) + '</option>').join(''); }
function fixesOf(item) { const i = (last.items || []).find(x => x.id === item); return i ? (i.fixes || []) : []; }
// 是正指示：登録の選択肢＋「自分で入力する」。入力欄は「自分で入力する」を選んだとき（または登録がない・登録と違う文のとき）だけ出す（11/5 鶴岡）
function fixOpts(item, kz, custom) {
  const f = fixesOf(item);
  if (!f.length) return '';
  return '<label>是正指示</label><select onchange="pickFix(this)" data-item="' + esc(item) + '"><option value="">（選ばない）</option>'
    + f.map(x => '<option value="' + esc(x.id) + '"' + (x.id === kz && !custom ? ' selected' : '') + '>' + esc(x.title) + '</option>').join('')
    + '<option value="__own"' + (custom ? ' selected' : '') + '>✏️ 自分で入力する</option></select>';
}
function isCustomFix(item, kz, fix) { const f = fixesOf(item); if (!f.length || !fix) return !f.length; const x = f.find(y => y.id === kz); return !x || x.how !== fix; }
const FROM = { '記録書': '記録書', '改善策': '登録', 'AI案': 'AI案', 'AI案（確認済）': 'AI案・確認済', '改善策（確認画面）': '登録', '確認画面': '手入力' };
function itemName(id) { const i = (last.items || []).find(x => x.id === id); return i ? i.name : ''; }

function render(d) {
  last = d;
  if (!d.ok) { app.innerHTML = '<p class="err">' + esc(d.error) + '</p>'; updateBar(); return; }
  if (d.state !== '完了') {
    app.innerHTML = '<p>' + esc(d.message) + '</p>' + (d.hold ? '<button onclick="holdChoice(\'over\')">上書きする</button><button class="sec" onclick="holdChoice(\'stop\')">やめる</button><div class="muted">上書き：前の記録書は消さずに「重複」として集計から外します。</div>'
      : (['受付', '読取中'].indexOf(d.state) >= 0 ? '<button onclick="load()">更新</button>' : ''));
    updateBar(); return;
  }
  let h = d.answer ? '<p class="ok">' + esc(d.answer) + '</p>' : '';
  h += headHtml(d) + txHtml() + topHtml(d);
  const isMemo = s => ((pend[s.id] || {}).kind ?? s.kind) === '申し送り';
  const main = d.shiteki.filter(s => !isMemo(s)), memo = d.shiteki.filter(isMemo);
  h += '<div class="sec2"><h2>指摘（' + main.length + '件）</h2>' + qBtn('iss') + '</div>'
    + helpBox('iss', '直すところは「直す」を押して変えます（数秒後に自動で保存。閉じたときも送ります）。写真は押さえたまま指摘まで動かすか、押して選んでから「ここへ」で移せます。写真はLINEのトークに送っても入ります。')
    + trayHtml();
  main.forEach(s => { h += issueHtml(s); });
  if (memo.length) { h += '<div class="sec2"><h2>申し送り（' + memo.length + '件）</h2></div>'; memo.forEach(s => { h += issueHtml(s, true); }); }
  adds.forEach((a, i) => { h += addedHtml(a, i); });
  // 下は3行だけ（11/7 鶴岡）：＋指摘を追加／＋好例（その他）を追加／文字起こし
  h += '<div class="more">';
  if (d.editable) h += '<div><button class="sec small" onclick="toggle(\'new\')">＋ 指摘を追加</button>' + newForm() + '</div>';
  h += zenHtml();
  h += goodHtml();
  h += '</div>';
  if (d.editable && !d.stopped) h += '<div style="margin-top:20px"><button id="cfbtn" style="width:100%;padding:12px" onclick="confirmFlow()">確定する</button></div>';
  else if (d.done) h += '<div style="margin-top:20px"><button style="width:100%;padding:12px" disabled>✓ 登録済み（' + (d.done.state === '確定' ? '確定' : '承認待ち') + '）</button></div>';
  app.innerHTML = h;
  openSet.forEach(id => { const e = document.getElementById('ed-' + id); if (e) e.classList.add('open'); });
  document.body.classList.toggle('picking', selPh.size > 0);
  updateBar();
}

function issueHtml(s, isMemo) {   // isMemo：申し送り（内容・写真・直すだけ。項目と是正は出さない）
  const p = pend[s.id] || {};
  const v = { kind: p.kind ?? s.kind, item: p.item ?? s.itemId, places: p.places ?? placesKey(s), fix: p.fix ?? (s.fix || ''), kz: p.kz ?? (s.kz || ''), cancel: p.cancel ?? s.cancelled, rtext: p.rtext ?? (s.rtext || '') };
  const changed = !!pend[s.id];
  const plLabel = (PLACES.find(x => x[0] === v.places) || PLACES[0])[1];
  // v17：印は 種別（指摘以外）・か所数（2以上）・要確認・重大・取消 だけ
  const tags = (v.kind !== '指摘' && !isMemo ? '<span class="tag' + (v.kind === '特記' ? ' warn' : '') + '">' + esc(v.kind) + '</span>' : '')
    + (v.places !== '1' ? '<span class="tag' + (v.places === '3+' ? ' warn' : '') + '">' + esc(plLabel) + '</span>' : '')
    + (s.ask ? '<span class="tag warn">要確認</span>' : '')
    + (s.severe ? '<span class="tag warn">重大</span>' : '')
    + (v.cancel ? '<span class="tag">取消</span>' : '');
  const shown = v.rtext && !isMemo ? v.rtext : s.text;   // 報告書に出す文があればそれを見せ、記録書の原文は下に小さく
  const text = (v.cancel ? '<s>' + esc(shown) + '</s>' : esc(shown)) + (s.place ? '<span class="l2">（' + esc(s.place) + '）</span>' : '')
    + (v.rtext && !isMemo && v.rtext !== s.text ? '<div class="l2">記録書：' + esc(s.text) + '</div>' : '');
  const k = esc(s.id);
  let h = '<div class="issue' + (changed ? ' changed' : '') + '" data-drop="' + k + '">'
    + '<div class="t">' + (s.no ? esc(s.no) + '. ' : '') + text + ' ' + tags + '</div>'
    + (isMemo ? '' : '<div class="l2">項目：' + (esc(itemName(v.item)) || '（なし）') + '</div>'
    + '<div class="l2">是正：' + (esc(v.fix) || '（なし）') + '</div>');
  if (s.prop && last.editable && !isMemo) {
    const p2 = s.prop2 || {}, keepT = s.prop === '（文はそのまま）', base = keepT ? (s.rtext || s.text || '') : s.prop;
    h += '<div class="prop"><div style="font-size:12px;font-weight:700;color:var(--acc)">AIの提案</div>'
    + (keepT ? '' : '<div>' + esc(s.prop) + '</div>')
    + (p2.item ? '<div class="l2">項目：' + esc(p2.itemName || p2.item) + '（今：' + (esc(itemName(v.item)) || 'なし') + '）</div>' : '')
    + (p2.places ? '<div class="l2">か所数：' + (p2.places === '3+' ? '3か所以上' : esc(p2.places) + 'か所') + '</div>' : '')
    + (p2.fix ? '<div class="l2">是正：' + esc(p2.fix) + '</div>' : '')
    + '<div class="edit" id="ed-pe' + k + '"><textarea class="txtin" id="pe-' + k + '">' + esc(base) + '</textarea><button class="small" onclick="propDo(\'' + k + '\',\'edit\')">これで決める</button></div>'
    + '<div class="b3"><button class="small" onclick="propDo(\'' + k + '\',\'take\')">採用</button><button class="sec small" onclick="toggle(\'pe' + k + '\')">修正</button><button class="sec small" onclick="propDo(\'' + k + '\',\'keep\')">元のまま</button></div></div>';
  }
  h += photoHtml(s.id, last.editable ? '<button class="sec small" style="margin:0 0 0 auto" onclick="toggle(\'' + k + '\')">直す</button>' : '');
  if (last.editable) {
    h += ''
      + '<div class="edit" id="ed-' + k + '">'
      + (isMemo ? '' : '<label>報告書に出す文</label><input type="text" value="' + esc(v.rtext || s.text) + '" onchange="setp(\'' + k + '\',\'rtext\',this.value)" oninput="setq(\'' + k + '\',\'rtext\',this.value)">')
      + '<label>種別</label><select onchange="setp(\'' + k + '\',\'kind\',this.value)">' + opts(KINDS.map(x => [x, x]), v.kind) + '</select>'
      + (isMemo ? '' : '<label>項目</label><select onchange="setp(\'' + k + '\',\'item\',this.value)">' + itemOpts(v.item) + '</select>'
      + '<label>か所数</label><select onchange="setp(\'' + k + '\',\'places\',this.value)">' + opts(PLACES, v.places) + '</select>'
      + fixOpts(v.item, v.kz, isCustomFix(v.item, v.kz, v.fix)).replace('pickFix(this)', 'pickFix(this,\'' + k + '\')')
      + '<div class="fixin' + (isCustomFix(v.item, v.kz, v.fix) ? ' open' : '') + '" id="fi-' + k + '"><label>' + (fixesOf(v.item).length ? '是正指示（入力）' : '是正指示') + '</label><input type="text" id="fx-' + k + '" value="' + esc(v.fix) + '" onchange="setp(\'' + k + '\',\'fix\',this.value)" oninput="setq(\'' + k + '\',\'fix\',this.value)"></div>')
      + '<label><input type="checkbox"' + (v.cancel ? ' checked' : '') + ' onchange="setp(\'' + k + '\',\'cancel\',this.checked)"> 取消（' + (isMemo ? 'この申し送りを外す' : 'この指摘は数えない') + '）</label>'
      + '</div>';
  }
  return h + '</div>';
}

function addedHtml(a, i) {
  const plLabel = (PLACES.find(x => x[0] === a.places) || PLACES[0])[1];
  return '<div class="issue changed"><div><span class="tag acc">追記</span><span class="tag">' + esc(a.kind) + '</span><span class="tag">' + esc(plLabel) + '</span><span class="tag acc">保存待ち</span></div>'
    + '<div class="t">' + esc(a.text) + '</div>'
    + '<div class="muted">項目：' + (esc(itemName(a.item)) || '（なし）') + '</div>'
    + '<div class="muted">是正：' + (esc(a.fix) || '（なし）') + '</div>'
    + (a.place ? '<div class="muted">場所：' + esc(a.place) + '</div>' : '')
    + '<button class="sec small" onclick="removeAdd(' + i + ')">追記をやめる</button></div>';
}

function newForm() {
  return '<div class="edit" id="ed-new">'
    + '<label>指摘の内容（必須）</label><input type="text" id="n-text">'
    + '<label>場所</label><input type="text" id="n-place">'
    + '<label>種別</label><select id="n-kind">' + opts(KINDS.map(x => [x, x]), '指摘') + '</select>'
    + '<label>項目</label><select id="n-item" onchange="newItem(this.value)">' + itemOpts('') + '</select>'
    + '<label>か所数</label><select id="n-places">' + opts(PLACES, '1') + '</select>'
    + '<div id="n-fixsel"></div>'
    + '<div class="fixin open" id="fi-new"><label>是正指示</label><input type="text" id="n-fix"></div>'
    + '<button onclick="addNew()">一覧に加える</button><span class="muted">（加えると自動で保存します）</span></div>';
}

function pickFix(sel, id) {
  const own = sel.value === '__own';
  const x = own ? null : fixesOf(sel.dataset.item).find(f => f.id === sel.value);
  const box = document.getElementById('fi-' + (id || 'new')), inp = document.getElementById(id ? 'fx-' + id : 'n-fix');
  if (box) box.classList.toggle('open', own || !sel.value);
  if (id) {
    pend[id] = Object.assign(pend[id] || {}, { kz: own ? '' : sel.value });
    if (x) { pend[id].fix = x.how; if (inp) inp.value = x.how; }
    setp(id, 'kz', own ? '' : sel.value);
  } else {
    document.getElementById('n-kz').value = own ? '' : sel.value; if (x && inp) inp.value = x.how;
  }
  if (own && inp) { inp.focus(); }
}
function newItem(item) {
  document.getElementById('n-fixsel').innerHTML = fixOpts(item, '') + '<input type="hidden" id="n-kz" value="">';
  const box = document.getElementById('fi-new'); if (box) box.classList.toggle('open', true);
}
function toggle(id) { const e = document.getElementById('ed-' + id); if (!e) return; e.classList.toggle('open'); if (e.classList.contains('open')) openSet.add(id); else openSet.delete(id); }
function setp(id, key, val) {
  const s = last.shiteki.find(x => x.id === id); if (!s) return;
  pend[id] = Object.assign(pend[id] || {}, { [key]: val });
  if (key === 'item') pend[id].kz = '';
  // 元と同じに戻したら未保存から外す
  const p = pend[id], same = (p.kind ?? s.kind) === s.kind && (p.item ?? s.itemId) === s.itemId && (p.places ?? placesKey(s)) === placesKey(s)
    && (p.fix ?? (s.fix || '')) === (s.fix || '') && (p.kz ?? (s.kz || '')) === (s.kz || '') && (p.cancel ?? s.cancelled) === s.cancelled
    && (p.rtext ?? (s.rtext || '')) === (s.rtext || '');
  if (same) delete pend[id];
  rerender();
  schedule();
}
// 入力中の文字：画面は書き換えず、入力が止まってから送る
function setq(id, key, val) {
  const s = last.shiteki.find(x => x.id === id); if (!s) return;
  pend[id] = Object.assign(pend[id] || {}, { [key]: val });
  schedule(2500);
}
function rerender() { const y = window.scrollY; render(last); window.scrollTo(0, y); }
function addNew() {
  const g = n => document.getElementById('n-' + n).value;
  if (!g('text').trim()) { const p = document.createElement('p'); p.className = 'err'; p.textContent = '指摘の内容を入れてください。'; document.getElementById('ed-new').prepend(p); return; }
  const kzEl = document.getElementById('n-kz');
  adds.push({ text: g('text').trim(), place: g('place').trim(), kind: g('kind'), item: g('item'), places: g('places'), fix: g('fix').trim(), kz: kzEl ? kzEl.value : '' });
  openSet.delete('new');
  rerender();
  schedule(300);
}
function removeAdd(i) { adds.splice(i, 1); rerender(); }
function discard() { pend = {}; adds = []; rerender(); }
function updateBar(msg) {
  const n = Object.keys(pend).length + adds.length;
  const text = msg ? msg : upFailed ? '写真を送れませんでした（残り' + upq.length + '枚）。電波のよい所で「もう一度送る」を押してください。'
    : failed ? '保存できませんでした（' + n + '件）。電波のよい所で「もう一度送る」を押してください。'
    : assigning ? 'AIが写真を指摘に振り分け中…（作業は続けられます）'
    : upq.length ? '写真を送信中 残り' + upq.length + '枚…（作業は続けられます。送り終わるまで閉じないでください）'
    : sending ? '保存中…（このまま作業を続けられます）'
    : n ? '保存待ち ' + n + '件（数秒後に自動で保存）'
    : photoMsg ? photoMsg
    : savedAt ? '✓ 保存しました（' + savedAt + '）' : '';
  document.getElementById('bar').classList.toggle('show', !!text);
  document.getElementById('barText').textContent = text;
  document.getElementById('retryBtn').style.display = (failed || upFailed) ? '' : 'none';
}
function snapshot() {
  const edits = Object.keys(pend).map(id => {
    const s = last.shiteki.find(x => x.id === id), p = pend[id];
    return { id: id, kind: p.kind ?? s.kind, item: p.item ?? s.itemId, places: p.places ?? placesKey(s), fix: p.fix ?? (s.fix || ''), kz: p.kz ?? (s.kz || ''), cancel: p.cancel ?? s.cancelled, rtext: p.rtext ?? (s.rtext || '') };
  });
  return { edits: edits, adds: adds.slice() };
}
function schedule(ms) { clearTimeout(timer); timer = setTimeout(flush, ms ?? 1500); updateBar(); }
// 裏で送る。送っている間に直したものは、次の回に送る
async function flush() {
  clearTimeout(timer);
  if (sending) { timer = setTimeout(flush, 800); return; }
  if (!(Object.keys(pend).length + adds.length)) { updateBar(); return; }
  const snap = snapshot(), sentP = JSON.parse(JSON.stringify(pend));
  sending = true; failed = false; updateBar();
  try {
    const d = await postData({ a: 'save', edits: snap.edits, adds: snap.adds });
    if (!d.ok) throw new Error(d.error || '');
    snap.edits.forEach(e => { savedIds.add(e.id); if (JSON.stringify(pend[e.id]) === JSON.stringify(sentP[e.id])) delete pend[e.id]; });
    adds = adds.filter(a => !snap.adds.includes(a));
    (d.shiteki || []).filter(x => x.method === '追記').forEach(x => savedIds.add(x.id));
    savedAt = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    d.answer = '';
    sending = false;
    applyData(d);
  } catch (e) { sending = false; failed = true; }
  updateBar();
  if (!failed && Object.keys(pend).length + adds.length) schedule();
}
const saveAll = flush;
// 文字を入力している最中は画面を書き換えない（入力が終わってから反映）
function typing() { const a = document.activeElement; return a && app.contains(a) && ((a.tagName === 'INPUT' && a.type !== 'file' && a.type !== 'checkbox') || a.tagName === 'TEXTAREA'); }   // v27：写真を選んだあとの欄・チェックは入力中に数えない
function applyData(d) {
  // 送ったばかりの写真が返事に入っていなくても消さない
  const ids = new Set((d.photos || []).map(x => x.id)), gone = new Set(removedPhotos);
  d.photos = (d.photos || []).filter(x => !gone.has(x.id)).concat(((last && last.photos) || []).filter(x => !ids.has(x.id) && !gone.has(x.id)));
  if (typing()) { last = d; renderLater = true; return; } const y = window.scrollY; render(d); window.scrollTo(0, y); }
document.addEventListener('focusout', () => { if (renderLater) setTimeout(() => { if (!typing() && renderLater) { renderLater = false; rerender(); } }, 0); });
// 閉じる・アプリを切り替えるときに、送りきれていない分を送る
function flushOnClose() {
  if (!last || !(Object.keys(pend).length + adds.length)) return;
  const snap = snapshot();
  try {
    fetch(API_URL, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' },

async function shrink(file, max, q) {

  try {
    const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = url; });
    const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}

async function confirmFlow() {
  const b = document.getElementById('cfbtn'); if (b) b.disabled = true;
  try {
    updateBar('点検しています…');
    for (let i = 0; i < 40 && (sending || Object.keys(pend).length + adds.length || upq.length); i++) { if (!sending) flush(); await new Promise(r => setTimeout(r, 500)); }
    if (Object.keys(pend).length + adds.length || upq.length) { flashPhoto('まだ送りきれていない直し・写真があります。電波のよい所でもう一度押してください'); return; }
    const c = await postData({ a: 'confirmCheck' });
    if (!c.ok) throw new Error(c.error || '');
    if (c.pre.block.length) { updateBar(); alertBox('確定の前に、次を済ませてください。', c.pre.block); return; }
    const msg = c.pre.warn.length ? '次の点を確認しました。このまま確定しますか？\n\n・' + c.pre.warn.join('\n・') : '確定しますか？（確定すると直せなくなります）';

    updateBar('登録しています…（30秒ほどかかることがあります）');
    let d = null;
    try { d = await postData({ a: 'confirm' }); } catch (e) { d = null; }
    if (!d || !d.ok) {
      // 返事が届かなかった・すでに確定済みのときは、読み直して今の状態を出す
      const now = await getData().catch(() => null);

    }

    flashPhoto(d.done && d.done.state === '確定' ? '登録しました（確定）' : '登録しました（承認待ち）');
    return;

  }
  s += '<div class="sec2"><h2>確定前の検査（' + cards.length + '）</h2></div>';
  if (cards.length) s += '<div class="muted" style="margin:-4px 0 8px">押すと、その検査の確認を始めます。</div>';
  cards.forEach(c => { s += cardHtml(c); });
  if (!cards.length) s += '<p class="muted">確定前の検査はありません。記録書を送ると、ここに出ます。</p>';
  app.innerHTML = s;
  updateBar();
}
function cardHtml(c) {
  return '<button class="hc' + (c.cur ? ' cur' : '') + '" onclick="openCard(\'' + esc(c.f) + '\')">'
    + (c.cur ? '<div class="hcur">LINEで押した検査</div>' : '')
    + '<div class="hrow"><b class="hnm">' + esc(homeLabel(c)) + '</b>' + (c.score !== '' && c.score != null ? '<span class="hsc">' + esc(c.score) + '<small>点</small></span>' : '') + '</div>'
    + '<div class="muted">記録書 ' + c.nRec + '枚' + (c.at ? '（' + esc(c.at) + '）' : '') + '・写真 ' + c.nPh + '枚・文字起こし ' + c.nTx + '件</div>'
    + (c.heads.length ? '<div class="hhd">指摘 ' + c.nSh + '件：' + c.heads.map(esc).join('／') + '</div>' : '<div class="hhd muted">指摘なし</div>')
    + (c.thumbs.length ? '<div class="hth">' + c.thumbs.map(b => '<span class="ph">' + img64(b) + '</span>').join('') + '</div>' : '')
    + (c.tx ? '<div class="htx">🎙 ' + esc(c.tx) + '</div>' : '')
    + (c.prop ? '<div class="hto">やること：物件の確認</div>' : '')
    + '</button>';
}
async function homeMove(i) {
  const x = homeD.waiting[i], el = document.getElementById('hs-' + i), to = el ? el.value : '';
  if (!to) { flashPhoto('入れる検査を選んでください'); return; }
  busy(true, '入れています…');
  try {
    const d = await postData({ a: 'homeMove', ids: x.ids, to: to });
    if (!d.ok) throw new Error(d.error || '');
    Object.keys(hSel).forEach(k => delete hSel[k]); hOpen.clear();
    if ((d.cards || []).length === 1 && !(d.waiting || []).length) { openCard(d.cards[0].f); return; }
    renderHome(d); window.scrollTo(0, 0);
  } catch (e) { flashPhoto((e && e.message) || '入れられませんでした。もう一度押してください'); }
  finally { busy(false); }
}
async function answer(ok) { app.textContent = '送信中…'; try { render(await getData({ a: 'inspector', ok: ok })); } catch (e) { load(); } }
async function answerName() {
  const v = (document.getElementById('fullname') || {}).value || '';
  if (!v.trim()) return;
  app.textContent = '送信中…'; try { render(await getData({ a: 'fullname', name: v.trim() })); } catch (e) { load(); }
}

liff.init({ liffId: LIFF_ID }).then(() => {
  if (!liff.isLoggedIn()) { liff.login(); return; }
  if (!fileId) { app.innerHTML = '<p class="err">開き方が違います。LINEのボタンから開いてください。</p>'; return; }
  load();
}).catch(() => { app.innerHTML = '<p class="err">LINEの中で開いてください。</p>'; });
</script>
