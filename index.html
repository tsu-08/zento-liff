<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記録書の確認</title>
<!-- 全棟品質評価 確認画面（LIFF）v22 2026-11-07（v21 から：申し送りは指摘と分けて「申し送り（○件）」に内容だけを並べる。項目・是正・写真・直すは出さない（11/7 鶴岡））
     v21 2026-11-07（v20 から：新しい版へ読み直すときに毎回違うURLにして、スマホに残った古い画面を使わないようにする）
     v20 2026-11-07（v19 から：指摘に置いた写真をつかんだとき、写真が小さくならず、たたんだあとも指の下に来るようにする。下は「＋ 指摘を追加」「＋ 好例（その他）を追加」「文字起こしデータあり（なければ＋ 文字起こしを追加）」の3行だけ（11/7 鶴岡）
     v19 2026-11-07（v18 から：写真の右上の×をなくし、写真をつかんだら画面の下にゴミ箱が出て、そこへ落とすと外す（消さずに退避）。つかみやすくする（押さえる時間を0.25秒に、つかんでいる間は画面がスクロールしないように）。選んだ写真は「外す」でも外せる（11/7 鶴岡）
     v18 2026-11-07（v17 から：下の「この画面は開いた本人だけが見られます」を外す（11/7 鶴岡）、確定済みの検査では未割当の欄に「確定済みのため動かせません」と出す）
     v17 2026-11-05（v16 から：画面を簡潔に（11/5 鶴岡「簡潔に、分かりやすく手戻りなく、直感的に」）。上に物件・工程・点数を1枚にまとめ、ほかの確定前の検査へ切り替え。済ませることは「やること」1つにまとめ、済んだら消える。指摘は内容・項目・是正の3行、印は要確認・重大・取消・種別だけ。AI案の「このままでよい」は確定時にまとめて。説明は「？」を押したときだけ。行き先待ちは一覧で選んで入れる。同じ記録書の「上書き／やめる」も画面で選べる（パソコンのLINE向け））
     v16 2026-11-05（v15 から：Android（Pixel など）で写真を押さえて動かせなかった不具合の修正（写真そのものを掴む既定の動きを止め、0.35秒押さえると持ち上がる）、是正指示の選択肢に「自分で入力する」を追加し、選んだときだけ入力欄を出す）
     v15 2026-11-03（v14 から：一番下に「確定する」。押すと先に点検し、止める理由（物件・同じ記録書・検査員の質問）と注意（AI案・要確認・未割当・行き先待ち）を出す。確定したら「09_試行」に書き出し、確定済みの表示にする）
     v14 2026-11-03（v13 から：物件の確認・変更（ANDPAD案件名で検索）、同じ物件・同じ工程の記録書の扱い（上書き／複数登録／やめる）、トークで送った行き先待ちの取り込み、写真を別の検査へ移す、音声・文字起こしの一覧、AI案の「このままでよい」、操作していた時間の計測、古い版なら自動で読み直す）
     v13（v12 から：たたんだ表示でも指摘に置いた写真を小さく出し、そこから押さえて別の指摘・未割当・好例へ動かせるようにする）
     v12（v11 から：写真を指で押さえて動かす（ドラッグ＆ドロップ）。写真を選ぶ・動かす間は指摘を表題だけにたたむ。未割当の選択は1枚ずつ）
     v11（v10 から：LINEのトークで送った写真が未割当にあれば、開いたときにAIの振り分けを自動で始める）
     v10（v9 から：写真をまとめて追加→AIが指摘に仮振り分け、決められないものは未割当。写真を押して選び、指摘・未割当・好例へ移せる。好例は好例欄に直接貼るか未割当から移す。見出し・項目は任意）
     ここには鍵もデータも置かない。データはGASがLINEのIDトークンを確かめてから返す（61 0.1の5）
     物件名は ANDPAD 案件名をそのまま出す（11/3 鶴岡。他社が見る見本・告知では匿名）。住所は扱わない -->
<style>
  :root { --bg:#f6f7f5; --card:#fff; --ink:#1d2421; --sub:#5d6b65; --line:#dde3df; --acc:#1f7a6d; --warn:#b4541a; --warnbg:#fdf1e8; --new:#e8f4f1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111614; --card:#1a201d; --ink:#e8eeeb; --sub:#9aa8a1; --line:#2c3531; --acc:#4fb8a6; --warn:#f0a36b; --warnbg:#2b2018; --new:#17302b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; padding-bottom:72px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:4px 0 12px; }
  h2 { font-size:16px; margin:16px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; gap:8px; }
  .k { color:var(--sub); font-size:13px; }
  .score { font-size:32px; font-weight:700; color:var(--acc); }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; border:1px solid var(--line); color:var(--sub); margin-right:4px; }
  .tag.warn { border-color:var(--warn); color:var(--warn); }
  .tag.acc { border-color:var(--acc); color:var(--acc); }
  .issue { border-top:1px solid var(--line); padding:10px 0; }
  .issue:first-child { border-top:none; }
  .issue.changed { background:var(--new); margin:0 -8px; padding:10px 8px; border-radius:8px; }
  .issue .t { font-weight:600; }
  .check { background:var(--warnbg); border:1px solid var(--warn); border-radius:10px; padding:12px; margin-bottom:10px; }
  button { font:inherit; border-radius:8px; border:1px solid var(--acc); background:var(--acc); color:#fff; padding:8px 16px; margin:6px 6px 0 0; }
  button.sec { background:transparent; color:var(--acc); }
  button.small { padding:4px 10px; font-size:13px; }
  .muted { color:var(--sub); font-size:13px; }
  .err { color:var(--warn); }
  .ok { color:var(--acc); }
  s { color:var(--sub); }
  .edit { margin-top:8px; padding:10px; border:1px dashed var(--line); border-radius:8px; display:none; }
  .edit.open { display:block; }
  .edit label { display:block; font-size:13px; color:var(--sub); margin-top:6px; }
  .edit select, .edit input[type=text] { font:inherit; width:100%; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px; display:none; }
  .bar.show { display:block; }
  .bar .in { max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .bar button { margin:0 0 0 6px; }
.tag.ok{background:#E3F4EA;color:#1E7A45;border-color:#1E7A45}
.photos{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.ph{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.up{opacity:.55}
.trash{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;align-items:center;justify-content:center;height:84px;background:#7a2a1a;color:#fff;font-size:15px;opacity:.92}
body.lifting .trash{display:flex}
.trash.drophover{outline:none;background:#c0391b;opacity:1}
.phx{position:absolute;top:0;right:0;margin:0;padding:0 7px;font-size:14px;line-height:22px;border-radius:0 0 0 6px;background:rgba(0,0,0,.55);border:none;color:#fff}
.phs{position:absolute;bottom:0;left:0;right:0;font-size:11px;text-align:center;background:rgba(255,255,255,.85);color:#333}
.phadd{display:inline-block;font-size:13px;color:var(--acc);border:1px dashed var(--acc);border-radius:8px;padding:6px 10px;cursor:pointer}
.ph{cursor:pointer}
.ph.sel{outline:3px solid var(--acc);outline-offset:-3px}
.phai{position:absolute;left:0;top:0;font-size:10px;line-height:16px;background:var(--acc);color:#fff;padding:0 4px;border-radius:0 0 6px 0}
.tray{border:1px dashed var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.goodrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.goodrow img{width:40px;height:40px;object-fit:cover;border-radius:4px;flex:none}
.goodrow input,.goodrow select{flex:1;min-width:0;font:inherit;font-size:13px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.ph{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ph img{pointer-events:none;-webkit-user-drag:none;user-drag:none}
.ph.lift{transform:scale(1.08);box-shadow:0 0 0 2px var(--acc)}
.fixin{display:none}.fixin.open{display:block}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.85;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.drophover{outline:3px dashed var(--acc);outline-offset:2px;border-radius:8px}
.phcount{display:none;font-size:12px;color:var(--sub)}
body.picking .issue .muted, body.picking .issue .edit, body.picking .issue > button, body.picking .issue .tag, body.picking .issue .photos .phadd { display:none !important; }
body.picking .issue{padding:8px 0}
body.picking .issue .photos{margin-top:2px}
.pickbar{display:flex;gap:6px;align-items:center;margin-top:6px}
.topbox{border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
.topbox.warnbox{background:var(--warnbg);border-color:var(--warn)}
.propres button{display:block;width:100%;text-align:left;margin:4px 0 0}
.files li{margin:4px 0}
.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.head .nm{font-weight:700;font-size:17px;line-height:1.4}
.head .sc{font-size:28px;font-weight:700;color:var(--acc);line-height:1}
.head .scl{font-size:11px;color:var(--sub);text-align:right}
.sw{font:inherit;font-size:13px;width:100%;margin-top:8px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.todo{background:var(--warnbg);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;margin-top:10px}
.todo h3{margin:0 0 4px;font-size:15px;color:var(--warn)}
.todo .ti{border-top:1px dashed var(--warn);padding:8px 0 4px}
.todo .ti:first-of-type{border-top:none}
.help{display:none;font-size:13px;color:var(--sub);background:var(--bg);border-radius:8px;padding:8px;margin-top:6px}
.help.open{display:block}
.q{display:inline-block;width:22px;height:22px;line-height:20px;text-align:center;border:1px solid var(--sub);border-radius:50%;color:var(--sub);font-size:13px;margin:0 0 0 6px;padding:0;background:transparent}
.sec2{display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px}
.sec2 h2{margin:0}
.wl .ph{width:56px;height:56px}
.wl .at{position:absolute;bottom:0;left:0;right:0;font-size:10px;text-align:center;background:rgba(0,0,0,.5);color:#fff}
.fold{cursor:pointer}
.issue .l2{color:var(--sub);font-size:13px}
.more>div{margin-top:8px}.more button{margin-top:0}
.files{margin:4px 0 0;padding-left:18px}
.memo{margin:0 0 14px;padding-left:20px}.memo li{margin:4px 0}
.txtin{width:100%;min-height:90px;font:inherit;font-size:14px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.addph{display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;border:1px dashed var(--acc);border-radius:6px;color:var(--acc);font-size:18px;cursor:pointer}
</style>
</head>
<body>
<main>
  <div id="app" class="card">読み込み中…</div>
</main>
<div class="trash" id="trash" data-drop="__trash">🗑 ここに落とすと外す（消さずに別のフォルダへ）</div>
<div class="bar" id="bar"><div class="in"><span id="barText"></span><span><button class="sec small" id="retryBtn" onclick="retryAll()" style="display:none">もう一度送る</button></span></div></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ===== 設定（鍵ではない。公開されても困らない値だけ） =====
const LIFF_ID = '2012275755-X1vUnCK8';
const API_URL = 'https://script.google.com/macros/s/AKfycbyljjXpJ46GLpiUFloQ3nnCi0ASy2Mhc88gn8C3z_kJo04ncJ8uJ5QWS-blT58K4ebM/exec';
// =====
const app = document.getElementById('app');
const qs = new URLSearchParams(location.search);
const fileId = qs.get('f') || new URLSearchParams((qs.get('liff.state') || '').replace(/^\?/, '')).get('f');
const sessionStart = Date.now();   // 手直しの時間の記録用（画面を開いた時刻）
const APP_VER = 22;                 // この画面の版。サーバーの方が新しければ自動で読み直す
// 操作していた時間（3分以上の空白は数えない。11/3 鶴岡 Q13）
let actMs = 0, lastAct = Date.now();
['pointerdown', 'keydown', 'input', 'change'].forEach(ev => document.addEventListener(ev, () => { const n = Date.now(); if (n - lastAct < 180000) actMs += n - lastAct; lastAct = n; }, true));
const KINDS = ['指摘', '未施工', '申し送り', '特記'];
const PLACES = [['1', '1か所'], ['2', '2か所'], ['3+', '3か所以上（共通）']];
let last = null;          // 最後に受け取った内容
let savedIds = new Set(); // この画面で保存した指摘
let savedMsg = '';         // 保存直後に下に出す文
let sending = false, failed = false, timer = null, renderLater = false, savedAt = '';
const openSet = new Set();   // 開いている「直す」欄
let upq = [], upBusy = false, upFailed = false, removedPhotos = [];   // 写真の送信待ち
let pend = {};            // 直したが未保存のもの { 指摘ID: {kind,item,places,fix,cancel} }
let adds = [];            // 追記したが未保存のもの
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const placesKey = s => (s.common || Number(s.places) >= 3) ? '3+' : (Number(s.places) === 2 ? '2' : '1');

async function getData(extra) {
  const q = new URLSearchParams(Object.assign({ t: liff.getIDToken(), f: fileId, s: sessionStart, act: actMs }, extra || {}));
  return (await fetch(API_URL + '?' + q.toString())).json();
}
async function postData(body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ liff: true, t: liff.getIDToken(), f: fileId, s: sessionStart, act: actMs }, body)) });
  return res.json();
}

function opts(list, cur) { return list.map(([v, l]) => '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>').join(''); }
function itemOpts(cur) { return '<option value="">（項目なし）</option>' + (last.items || []).map(i => '<option value="' + esc(i.id) + '"' + (i.id === cur ? ' selected' : '') + '>' + esc(i.name) + '</option>').join(''); }
function fixesOf(item) { const i = (last.items || []).find(x => x.id === item); return i ? (i.fixes || []) : []; }
// 是正指示：登録の選択肢＋「自分で入力する」。入力欄は「自分で入力する」を選んだとき（または登録がない・登録と違う文のとき）だけ出す（11/5 鶴岡）
function fixOpts(item, kz, custom) {
  const f = fixesOf(item);
  if (!f.length) return '';
  return '<label>是正指示</label><select onchange="pickFix(this)" data-item="' + esc(item) + '"><option value="">（選ばない）</option>'
    + f.map(x => '<option value="' + esc(x.id) + '"' + (x.id === kz && !custom ? ' selected' : '') + '>' + esc(x.title) + '</option>').join('')
    + '<option value="__own"' + (custom ? ' selected' : '') + '>✏️ 自分で入力する</option></select>';
}
function isCustomFix(item, kz, fix) { const f = fixesOf(item); if (!f.length || !fix) return !f.length; const x = f.find(y => y.id === kz); return !x || x.how !== fix; }
const FROM = { '記録書': '記録書', '改善策': '登録', 'AI案': 'AI案', 'AI案（確認済）': 'AI案・確認済', '改善策（確認画面）': '登録', '確認画面': '手入力' };
function itemName(id) { const i = (last.items || []).find(x => x.id === id); return i ? i.name : ''; }

function render(d) {
  last = d;
  if (!d.ok) { app.innerHTML = '<p class="err">' + esc(d.error) + '</p>'; updateBar(); return; }
  if (d.state !== '完了') {
    app.innerHTML = '<p>' + esc(d.message) + '</p>' + (d.hold ? '<button onclick="holdChoice(\'over\')">上書きする</button><button class="sec" onclick="holdChoice(\'stop\')">やめる</button><div class="muted">上書き：前の記録書は消さずに「重複」として集計から外します。</div>'
      : (['受付', '読取中'].indexOf(d.state) >= 0 ? '<button onclick="load()">更新</button>' : ''));
    updateBar(); return;
  }
  let h = d.answer ? '<p class="ok">' + esc(d.answer) + '</p>' : '';
  h += headHtml(d) + topHtml(d);
  const isMemo = s => ((pend[s.id] || {}).kind ?? s.kind) === '申し送り';
  const main = d.shiteki.filter(s => !isMemo(s)), memo = d.shiteki.filter(isMemo);
  h += '<div class="sec2"><h2>指摘（' + main.length + '件）</h2>' + qBtn('iss') + '</div>'
    + helpBox('iss', '直すところは「直す」を押して変えます（数秒後に自動で保存。閉じたときも送ります）。写真は押さえたまま指摘まで動かすか、押して選んでから「ここへ」で移せます。写真はLINEのトークに送っても入ります。')
    + trayHtml();
  main.forEach(s => { h += issueHtml(s); });
  if (memo.length) h += '<div class="sec2"><h2>申し送り（' + memo.length + '件）</h2></div><ul class="memo">' + memo.map(s => '<li>' + esc(s.text) + (s.place ? '（' + esc(s.place) + '）' : '') + '</li>').join('') + '</ul>';
  adds.forEach((a, i) => { h += addedHtml(a, i); });
  // 下は3行だけ（11/7 鶴岡）：＋指摘を追加／＋好例（その他）を追加／文字起こし
  h += '<div class="more">';
  if (d.editable) h += '<div><button class="sec small" onclick="toggle(\'new\')">＋ 指摘を追加</button>' + newForm() + '</div>';
  h += goodHtml();
  h += filesHtml();
  h += '</div>';
  if (d.editable && !d.stopped) h += '<div style="margin-top:20px"><button id="cfbtn" style="width:100%;padding:12px" onclick="confirmFlow()">確定する</button></div>';
  app.innerHTML = h;
  openSet.forEach(id => { const e = document.getElementById('ed-' + id); if (e) e.classList.add('open'); });
  document.body.classList.toggle('picking', selPh.size > 0);
  updateBar();
}

function issueHtml(s) {
  const p = pend[s.id] || {};
  const v = { kind: p.kind ?? s.kind, item: p.item ?? s.itemId, places: p.places ?? placesKey(s), fix: p.fix ?? (s.fix || ''), kz: p.kz ?? (s.kz || ''), cancel: p.cancel ?? s.cancelled };
  const changed = !!pend[s.id];
  const plLabel = (PLACES.find(x => x[0] === v.places) || PLACES[0])[1];
  // v17：印は 種別（指摘以外）・か所数（2以上）・要確認・重大・取消 だけ
  const tags = (v.kind !== '指摘' ? '<span class="tag' + (v.kind === '特記' ? ' warn' : '') + '">' + esc(v.kind) + '</span>' : '')
    + (v.places !== '1' ? '<span class="tag' + (v.places === '3+' ? ' warn' : '') + '">' + esc(plLabel) + '</span>' : '')
    + (s.ask ? '<span class="tag warn">要確認</span>' : '')
    + (s.severe ? '<span class="tag warn">重大</span>' : '')
    + (v.cancel ? '<span class="tag">取消</span>' : '');
  const text = (v.cancel ? '<s>' + esc(s.text) + '</s>' : esc(s.text)) + (s.place ? '<span class="l2">（' + esc(s.place) + '）</span>' : '');
  const k = esc(s.id);
  let h = '<div class="issue' + (changed ? ' changed' : '') + '" data-drop="' + k + '">'
    + '<div class="t">' + (s.no ? esc(s.no) + '. ' : '') + text + ' ' + tags + '</div>'
    + '<div class="l2">項目：' + (esc(itemName(v.item)) || '（なし）') + '</div>'
    + '<div class="l2">是正：' + (esc(v.fix) || '（なし）') + '</div>';

// 長辺 max px の JPEG にして base64 で返す（保存容量と通信を抑える）
async function shrink(file, max, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = url; });
    const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}

  if (!d.lifted) { clearTimeout(d.timer); drag = null; pickPh(d.id); return; }
  if (!d.moved) { endDrag(); drag = null; refreshSoon(); return; }   // 持ち上げただけで離した → 選んだままにする
  const z = dropAt(e.clientX, e.clientY);
  endDrag(); drag = null; renderLater = false;
  if (z && z.dataset.drop === '__trash') delPhotos([...selPh]);
  else if (z) movePhotos(z.dataset.drop); else rerender();
}
function phCancel() { if (!drag) return; endDrag(); drag = null; rerender(); }
// ゴミ箱へ落とした・「外す」を押した写真を外す（消さずに「05_外した写真」へ移す）
async function delPhotos(pids) {
  if (!pids.length) return;
  pids.forEach(id => { removedPhotos.push(id); selPh.delete(id); });
  last.photos = (last.photos || []).filter(x => !pids.includes(x.id));
  refreshSoon();
  let ng = 0;
  for (const pid of pids) { try { const d = await postData({ a: 'photoDel', pid: pid }); if (!d.ok) throw new Error(''); } catch (e) { ng++; } }
  flashPhoto(ng ? '外せなかった写真があります（' + ng + '枚）。開き直してください' : pids.length + '枚を外しました（消さずに別のフォルダへ移しました）');
}
function delSelected() { if (confirm(selPh.size + '枚を外しますか？（消さずに別のフォルダへ移します）')) delPhotos([...selPh]); }
// つかんでいる間は画面をスクロールさせない（Android でつかみ損ねるのを防ぐ）
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });
async function delPhoto(pid) {
  if (!confirm('この写真を外しますか？（消さずに別のフォルダへ移します）')) return;
  try {
    const d = await postData({ a: 'photoDel', pid: pid });
    if (!d.ok) throw new Error(d.error || '');
    removedPhotos.push(pid); selPh.delete(pid);
    last.photos = (last.photos || []).filter(x => x.id !== pid);
    refreshSoon();
  } catch (e) { alert('外せませんでした。もう一度お試しください。'); }
}
// LINEのトークで送った写真（まだAIが見ていない未割当）があれば、開いたときに振り分ける
function autoAssign() { if (last && last.editable && photosWhere(x => !x.good && !x.sid && !x.judged).length) { newUnassigned = 1; runAssign(); } }
function retryAll() { if (upq.length) pumpUploads(); else if (newUnassigned) runAssign(); if (failed) flush(); }

// ===== v17：上の1枚（物件・工程・点数・検査の切り替え）と「やること」 =====
const helpOpen = new Set();
function qBtn(id) { return '<button class="q" onclick="toggleHelp(\'' + id + '\')">？</button>'; }
function helpBox(id, text) { return '<div class="help' + (helpOpen.has(id) ? ' open' : '') + '" id="hp-' + id + '">' + text + '</div>'; }
function toggleHelp(id) { if (helpOpen.has(id)) helpOpen.delete(id); else helpOpen.add(id); const e = document.getElementById('hp-' + id); if (e) e.classList.toggle('open'); }
function headHtml(d) {
  const sure = d.prop && d.prop.how === '確認済';
  let h = '<div class="head"><div><div class="nm">' + esc(d.name || '（物件名なし）') + '</div><div class="muted">' + esc(d.process) + '　' + esc(d.date) + '</div>'
    + (sure && d.editable ? '<button class="sec small" style="margin-top:2px" onclick="toggle(\'prop\')">物件を変更</button>' : '') + '</div>'
    + '<div><div class="sc">' + esc(d.score) + '</div><div class="scl">点（確定前）</div></div></div>';
  if (sure && d.editable) h += propEdit();
  const o = d.others || [];
  if (o.length) h += '<select class="sw" onchange="if(this.value)location.replace(location.pathname+\'?f=\'+encodeURIComponent(this.value))"><option value="">ほかの確定前の検査を開く（' + o.length + '件）</option>'
    + o.map(x => '<option value="' + esc(x.f) + '">' + esc(x.label) + '</option>').join('') + '</select>';
  return h;
}
function propEdit() {
  return '<div class="edit" id="ed-prop"><label>案件名で探す（ANDPADの案件名）</label><input type="text" id="propq" oninput="propSearch()" placeholder="例：尾川">'
    + '<div class="propres" id="propres"></div><button class="sec small" onclick="propNew()">入力した名前で新しい物件にする</button></div>';
}
function todoItems(d) {
  const t = [];
  if (!d.editable) return t;
  const sure = d.prop && d.prop.how === '確認済';
  if (!sure) t.push('<b>物件はこれでよいですか？</b>　' + esc(d.name || '（物件名なし）') + '<div><button class="small" onclick="propOk()">これでよい</button><button class="sec small" onclick="toggle(\'prop\')">別の物件を選ぶ</button></div>' + propEdit());
  (d.checks || []).filter(c => !c.done).forEach(c => {
    if (c.type === 'inspector') t.push(esc(c.text) + '<div><button class="small" onclick="answer(1)">はい</button><button class="sec small" onclick="answer(0)">違う</button></div>');
    else if (c.type === 'fullname') t.push(esc(c.text) + '<div><input id="fullname" placeholder="例：山田 太郎" style="font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;width:60%;background:var(--card);color:var(--ink)"><button class="small" onclick="answerName()">送る</button></div>');
    else t.push(esc(c.text));
  });
  if ((d.dup || []).length) t.push('<b>同じ物件・同じ工程の記録書がもうあります</b>（' + d.dup.map(x => esc(x.kid) + (x.date ? '・' + esc(x.date) : '')).join('、') + '）' + qBtn('dup')
    + helpBox('dup', '上書き：前の記録書を「重複」として集計から外します。複数登録：範囲違いや別の検査員の分として両方残します。やめる：この記録書を集計から外します。どれも消しません。')
    + '<div><button class="small" onclick="dupChoice(\'over\')">上書き</button><button class="sec small" onclick="dupChoice(\'multi\')">複数登録</button><button class="sec small" onclick="dupChoice(\'stop\')">やめる</button></div>');
  if (d.waiting > 0) t.push(waitHtml(d));
  return t;
}
const selW = new Set();
function waitHtml(d) {
  const wl = d.waitList || [];
  return '<b>行き先待ちが ' + d.waiting + '件</b>（トークで送った分）。この検査の分を選んで入れてください' + qBtn('wait')
    + helpBox('wait', '押して選び「選んだものを入れる」。全部この検査の分なら「全部入れる」。ほかの検査の分は、その検査の画面（上の切り替え）で入れます。')
    + '<div class="photos wl">' + wl.map(x => x.type === 'photo'
      ? '<span class="ph' + (selW.has(x.id) ? ' sel' : '') + '" onclick="pickW(\'' + esc(x.id) + '\')">' + img64(x.thumb) + '<span class="at">' + esc(x.at) + '</span></span>'
      : '<button class="' + (selW.has(x.id) ? '' : 'sec ') + 'small" onclick="pickW(\'' + esc(x.id) + '\')">' + (x.type === 'audio' ? '🎙 音声' : '📝 ' + esc(String(x.text).slice(0, 12))) + '</button>').join('') + '</div>'
    + '<div>' + (selW.size ? '<button class="small" onclick="claimWaiting(true)">選んだものを入れる（' + selW.size + '）</button>' : '') + '<button class="sec small" onclick="claimWaiting(false)">全部入れる</button></div>';
}
function pickW(id) { if (selW.has(id)) selW.delete(id); else selW.add(id); refreshSoon(); }
function holdChoice(c) { app.textContent = '送信中…'; postData({ a: 'dupfile', c: c }).then(render).catch(load); }
// ===== 物件・同じ記録書・行き先待ち・音声/文字起こし（11/3 鶴岡）=====
function topHtml(d) {
  let h = '';
  if (d.done) h += '<div class="topbox"><b>' + (d.done.state === '確定' ? '確定しました' : '登録完了（承認待ち）') + '</b>　' + esc(d.done.at)
    + (d.done.url ? '<div><a href="' + esc(d.done.url) + '" target="_blank">書き出したデータ（09_試行）</a></div>' : '') + '</div>';
  if (d.stopped) h += '<div class="topbox warnbox">この記録書は登録をやめました（消してはいません）。</div>';
  const t = todoItems(d);
  if (t.length) h += '<div class="todo"><h3>やること（' + t.length + '）</h3>' + t.map((x, i) => '<div class="ti">' + (t.length > 1 ? (i + 1) + '. ' : '') + x + '</div>').join('') + '</div>';
  return h;
}
function topHtmlOld(d) {
  let h = '';
  if (d.done) h += '<div class="topbox"><b>' + (d.done.state === '確定' ? '確定しました' : '登録完了（承認待ち）') + '</b>　' + esc(d.done.at)
    + (d.done.approver ? '<div class="muted">承認：' + esc(d.done.approver) + '（試行：鶴岡さんの承認とみなす）</div>' : '<div class="muted">承認の仕組みができるまで、報告書は出しません。</div>')
    + (d.done.url ? '<div><a href="' + esc(d.done.url) + '" target="_blank">書き出したデータ（09_試行）</a></div>' : '<div class="muted">書き出しは数分以内に自動で行います。</div>') + '</div>';
  if (d.stopped) h += '<div class="topbox warnbox">この記録書は登録をやめました（消してはいません）。</div>';
  const how = (d.prop && d.prop.how) || '';
  const sure = how === '確認済';
  h += '<div class="topbox"><div class="k">物件（ANDPAD案件名）</div><div><b>' + esc(d.name || '（物件名なし）') + '</b>'
    + (!sure && how ? ' <span class="tag warn">' + esc(how) + '</span>' : '') + '</div>';
  if (d.editable) {
    h += '<div>' + (!sure ? '<button class="small" onclick="propOk()">この物件でよい</button>' : '')
      + '<button class="sec small" onclick="toggle(\'prop\')">' + (sure ? '物件を変更' : '別の物件を選ぶ') + '</button></div>'
      + '<div class="edit" id="ed-prop"><label>案件名で探す（ANDPADの案件名）</label><input type="text" id="propq" oninput="propSearch()" placeholder="例：尾川">'
      + '<div class="propres" id="propres"></div><button class="sec small" onclick="propNew()">入力した名前で新しい物件にする</button></div>';
  }
  h += '</div>';
  if (d.editable && (d.dup || []).length) {
    h += '<div class="topbox warnbox">同じ物件・同じ工程の記録書がもうあります（' + d.dup.map(x => esc(x.kid) + (x.date ? '・' + esc(x.date) : '')).join('、') + '）。<div>'
      + '<button class="small" onclick="dupChoice(\'over\')">上書きする</button><button class="sec small" onclick="dupChoice(\'multi\')">複数登録する</button>'
      + '<button class="sec small" onclick="dupChoice(\'stop\')">やめる</button></div><div class="muted">上書き：前の記録書を「重複」として集計から外します。複数登録：範囲違いや別の検査員の分として両方残します。やめる：この記録書を集計から外します（どれも消しません）。</div></div>';
  }
  if (d.editable && d.waiting > 0) {
    h += '<div class="topbox warnbox">トークで送った「行き先待ち」の写真・音声・文字起こしが ' + d.waiting + '件あります。<div><button class="small" onclick="claimWaiting()">この検査に入れる</button></div></div>';
  }
  return h;
}
function filesHtml() {
  const f = last.files || [];
  if (!f.length) {
    if (!last.editable) return '';
    return '<div><button class="sec small" onclick="toggle(\'txt\')">＋ 文字起こしを追加</button><div class="edit" id="ed-txt"><textarea class="txtin" id="txtin" placeholder="文字起こしを貼り付け"></textarea><button class="small" onclick="addText()">追加する</button></div></div>';
  }
  const open = helpOpen.has('files');
  return '<div><span class="ok fold" onclick="toggleFiles()">📝 文字起こしデータあり（' + f.length + '件）' + (open ? ' ▴' : ' ▾') + '</span>'
    + (open ? '<ul class="files">' + f.map(x => '<li>' + (x.kind === '音声' ? '🎙 音声' : esc(x.text || '文字起こし'))
      + (last.editable ? ' <button class="sec small" onclick="fileDel(\'' + esc(x.id) + '\')">外す</button>' : '') + '</li>').join('') + '</ul>' : '') + '</div>';
}
function toggleFiles() { if (helpOpen.has('files')) helpOpen.delete('files'); else helpOpen.add('files'); rerender(); }
function addText() { const v = (document.getElementById('txtin') || {}).value || ''; if (!v.trim()) return; openSet.delete('txt'); act({ a: 'addText', text: v }); }
function propSearch() {
  const q = (document.getElementById('propq').value || '').replace(/\s|　/g, '');
  const box = document.getElementById('propres');
  if (!q) { box.innerHTML = ''; return; }
  const hit = (last.props || []).filter(p => String(p.name).replace(/\s|　/g, '').indexOf(q) >= 0).slice(-8).reverse();
  box.innerHTML = hit.length ? hit.map(p => '<button class="sec small" onclick="setProp(\'' + esc(p.id) + '\')">' + esc(p.name) + '</button>').join('') : '<div class="muted">当たる物件がありません</div>';
}
async function act(body, okMsg) {
  updateBar('送信中…');
  try { const d = await postData(body); if (!d.ok) throw new Error(d.error || ''); applyData(d); if (d.answer) flashPhoto(d.answer); }
  catch (e) { flashPhoto((e && e.message) || '送れませんでした。もう一度お試しください'); }
}
function setProp(bk) { openSet.delete('prop'); act({ a: 'setProp', bk: bk }); }
function propOk() { act({ a: 'setProp', ok: 1 }); }
function propNew() { const n = (document.getElementById('propq').value || '').trim(); if (!n) return; openSet.delete('prop'); act({ a: 'setProp', name: n }); }
function dupChoice(c) { act({ a: 'dupChoice', c: c }); }
async function claimWaiting(onlySel) { const ids = onlySel ? [...selW] : null; selW.clear(); await act(Object.assign({ a: 'claimWaiting' }, ids ? { ids: ids } : {})); autoAssign(); }
function fileDel(aid) { if (confirm('外しますか？（消さずに別のフォルダへ移します）')) act({ a: 'fileDel', aid: aid }); }
function fixOk(sid) { const s = (last.shiteki || []).find(x => x.id === sid); if (s) s.fixFrom = 'AI案（確認済）'; refreshSoon(); act({ a: 'fixOk', sid: sid }); }
function toOther(kid) { if (!kid) return; const pids = [...selPh]; selPh.clear(); pids.forEach(id => removedPhotos.push(id)); last.photos = (last.photos || []).filter(x => !pids.includes(x.id)); refreshSoon(); act({ a: 'photoToKs', pids: pids, to: kid }); }
// 確定（v15）：送りきれていない直しを先に送る → 点検 → 注意があれば確かめてから確定
async function confirmFlow() {
  const b = document.getElementById('cfbtn'); if (b) b.disabled = true;
  try {
    updateBar('点検しています…');
    for (let i = 0; i < 40 && (sending || Object.keys(pend).length + adds.length || upq.length); i++) { if (!sending) flush(); await new Promise(r => setTimeout(r, 500)); }
    if (Object.keys(pend).length + adds.length || upq.length) { flashPhoto('まだ送りきれていない直し・写真があります。電波のよい所でもう一度押してください'); return; }
    const c = await postData({ a: 'confirmCheck' });
    if (!c.ok) throw new Error(c.error || '');
    if (c.pre.block.length) { updateBar(); alertBox('確定の前に、次を済ませてください。', c.pre.block); return; }
    const msg = c.pre.warn.length ? '次の点を確認しました。このまま確定しますか？\n\n・' + c.pre.warn.join('\n・') : '確定しますか？（確定すると直せなくなります）';
    if (!confirm(msg)) { updateBar(); return; }
    updateBar('確定して書き出しています…（30秒ほどかかることがあります）');
    const d = await postData({ a: 'confirm' });
    if (!d.ok) throw new Error(d.error || '');
    applyData(d); window.scrollTo(0, 0); updateBar();
  } catch (e) { flashPhoto((e && e.message) || '確定できませんでした。もう一度お試しください'); }
  finally { const b2 = document.getElementById('cfbtn'); if (b2) b2.disabled = false; }
}
function alertBox(title, list) {
  const old = document.getElementById('cfmsg'); if (old) old.remove();
  const box = document.createElement('div'); box.id = 'cfmsg'; box.className = 'topbox warnbox';
  box.innerHTML = '<b>' + esc(title) + '</b><ul>' + list.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  const b = document.getElementById('cfbtn'); (b ? b.parentNode : app).appendChild(box); box.scrollIntoView({ block: 'center' });
}
// 古い版で開いていたら、新しい版で開き直す（ログイン不要。11/3 鶴岡 Q10）
function needReload(d) {
  if (!d || !d.appVersion || d.appVersion <= APP_VER) return false;
  if (Number(qs.get('v') || 0) >= d.appVersion) return false;   // 読み直しても古いまま（配信待ち）なら繰り返さない
  location.replace(location.pathname + '?v=' + d.appVersion + '&t=' + Date.now() + '&f=' + encodeURIComponent(fileId));
  return true;
}

async function load() { app.textContent = '読み込み中…'; try { const d = await getData(); if (needReload(d)) return; render(d); autoAssign(); } catch (e) { app.innerHTML = '<p class="err">通信できませんでした。もう一度開いてください。</p>'; } }
async function answer(ok) { app.textContent = '送信中…'; try { render(await getData({ a: 'inspector', ok: ok })); } catch (e) { load(); } }
async function answerName() {
  const v = (document.getElementById('fullname') || {}).value || '';
  if (!v.trim()) return;
  app.textContent = '送信中…'; try { render(await getData({ a: 'fullname', name: v.trim() })); } catch (e) { load(); }
}

liff.init({ liffId: LIFF_ID }).then(() => {
  if (!liff.isLoggedIn()) { liff.login(); return; }
  if (!fileId) { app.innerHTML = '<p class="err">開き方が違います。LINEのボタンから開いてください。</p>'; return; }
  load();
}).catch(() => { app.innerHTML = '<p class="err">LINEの中で開いてください。</p>'; });
